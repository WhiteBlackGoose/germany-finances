<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deutsches Steuersystem 2024</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --purple: #a855f7;
  --teal: #2dd4bf;
  --amber: #f59e0b;
  --net: #ebebeb;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  gap: 14px;
}

header { text-align: center; }

header h1 {
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

header p {
  font-size: 0.75rem;
  color: var(--muted);
  margin-top: 4px;
}

/* ── Leiste oben rechts: Zeitraum und Sprache ── */
.topbar {
  position: fixed;
  top: 14px;
  right: 16px;
  display: flex;
  gap: 8px;
  z-index: 10;
}

.topbar .seg {
  display: flex;
  gap: 2px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 2px;
}

.topbar button {
  font-family: inherit;
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--muted);
  background: none;
  border: none;
  border-radius: 5px;
  padding: 4px 10px;
  cursor: pointer;
}

.topbar button:hover { color: var(--text); }

.topbar button.active {
  color: var(--purple);
  background: rgba(168,85,247,0.12);
}

#langs button { text-transform: uppercase; letter-spacing: 0.06em; }

/* ── Top-Menü ── */
nav.tabs {
  display: flex;
  gap: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 4px;
}

nav.tabs button {
  font-family: inherit;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--muted);
  background: none;
  border: none;
  border-radius: 7px;
  padding: 7px 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 7px;
  transition: color 0.15s, background 0.15s;
}

nav.tabs button:hover { color: var(--text); }

nav.tabs button .tab-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.45;
}

nav.tabs button.active {
  color: var(--text);
  background: #21262d;
  box-shadow: inset 0 0 0 1px var(--border);
}

nav.tabs button.active .tab-dot { opacity: 1; }
nav.tabs button[data-view="tax"].active     { color: var(--purple); }
nav.tabs button[data-view="benefits"].active { color: var(--teal); }

/* ── Wie das Diagramm zu lesen ist ── */
.readhint {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.73rem;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 5px 15px 5px 9px;
}

.readhint svg { display: block; }
.readhint b { color: var(--text); font-weight: 600; }

footer {
  font-size: 0.68rem;
  color: #6b7280;
  text-align: center;
  line-height: 1.7;
  padding-bottom: 4px;
}

footer a {
  color: var(--muted);
  text-decoration: none;
  border-bottom: 1px solid var(--border);
}

footer a:hover { color: var(--text); border-bottom-color: var(--muted); }

.controls {
  display: flex;
  align-items: center;
  gap: 8px 16px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 920px;
  font-size: 0.68rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.controls.hidden { display: none; }

.controls + .controls { margin-top: -4px; }

.controls .group { display: flex; align-items: center; gap: 6px; }

.controls button,
.controls select,
.controls input[type=number] {
  font-family: inherit;
  font-size: 0.72rem;
  letter-spacing: 0;
  text-transform: none;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px 8px;
  cursor: pointer;
}

.controls button { color: var(--muted); padding: 3px 9px; }
.controls button:hover { color: var(--text); }

.controls button.active {
  color: var(--purple);
  border-color: var(--purple);
  background: rgba(168,85,247,0.10);
}

.controls input[type=number] { width: 58px; cursor: text; }

.toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  user-select: none;
  letter-spacing: 0;
  text-transform: none;
  font-size: 0.72rem;
}

.toggle input { accent-color: var(--teal); width: 13px; height: 13px; cursor: pointer; }

.main {
  display: flex;
  gap: 22px;
  align-items: flex-start;
}

/* ── Slider — absolut positioniert, exakt auf die Plot-Fläche ausgerichtet ── */
.slider-section {
  position: relative;
  width: 96px;
  flex-shrink: 0;
}

.slider-label {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.7rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  white-space: nowrap;
}

.slider-track {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 36px;
}

#incomeSlider {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) rotate(-90deg);
  transform-origin: 50% 50%;
  cursor: ns-resize;
  accent-color: var(--purple);
  -webkit-appearance: none;
  appearance: none;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  outline: none;
}

#incomeSlider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--purple);
  cursor: ns-resize;
  box-shadow: 0 0 0 4px rgba(168,85,247,0.2);
  transition: box-shadow 0.15s;
}
#incomeSlider::-webkit-slider-thumb:hover { box-shadow: 0 0 0 6px rgba(168,85,247,0.35); }

#incomeSlider::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border: none;
  border-radius: 50%;
  background: var(--purple);
  cursor: ns-resize;
}

.income-display {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  font-size: 1rem;
  font-weight: 700;
  color: var(--purple);
  letter-spacing: -0.02em;
  white-space: nowrap;
}

#chart {
  display: block;
  flex-shrink: 0;
  cursor: ns-resize;
  touch-action: none;
  user-select: none;
}

/* ── Info panel ── */
.info-panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 250px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
}

.card-title {
  font-size: 0.65rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.09em;
  margin-bottom: 10px;
}

.info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 3px 0;
  font-size: 0.82rem;
}

.dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 2px;
  margin-right: 7px;
  vertical-align: middle;
  flex-shrink: 0;
}

.row-label {
  display: flex;
  align-items: center;
  color: var(--muted);
  font-size: 0.78rem;
}

.row-label .rate { opacity: 0.6; margin-left: 4px; }

.row-value { font-weight: 600; font-size: 0.82rem; white-space: nowrap; }

.divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: 8px 0;
}

.highlight-row {
  background: rgba(168,85,247,0.07);
  border-radius: 6px;
  padding: 6px 8px;
  margin-top: 2px;
}

.bracket-item {
  border-bottom: 1px solid var(--border);
  padding: 7px 0;
}
.bracket-item:last-child { border-bottom: none; }

.bracket-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 2px;
}

.bracket-name { font-size: 0.75rem; display: flex; align-items: center; }

.rate-badge {
  background: rgba(168,85,247,0.15);
  color: var(--purple);
  border-radius: 4px;
  font-size: 0.68rem;
  font-weight: 700;
  padding: 1px 5px;
  white-space: nowrap;
}

.bracket-amount { font-size: 0.78rem; font-weight: 600; text-align: right; }
.bracket-sub    { font-size: 0.68rem; color: var(--muted); }

.footnote {
  font-size: 0.66rem;
  color: var(--muted);
  line-height: 1.45;
  margin-top: 8px;
}
</style>
</head>
<body>

<div class="topbar">
  <div class="seg" id="periods">
    <button data-period="month" id="btnMonth"></button>
    <button data-period="year" id="btnYear" class="active"></button>
  </div>

    <button data-lang="en">en</button>
  </div>
</div>

<header>

<nav class="tabs" id="tabs">

<div class="readhint">

<!-- Haushalt: gilt für beide Ansichten -->
<div class="controls">

  <div class="group">
    <span id="adultsLabel"></span>

  </div>
  <div class="group">
    <span id="kidsLabel"></span>
    <select id="kids">
      <option value="0">0</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
    </select>
  </div>
  <div class="group">
    <span id="regionLabel"></span>
    <select id="region">
      <option value="west"></option>
      <option value="ost"></option>
      <option value="sachsen"></option>
    </select>
  </div>
</div>

<!-- Nur Abgaben -->
<div class="controls" id="controlsTax">
  <div class="group">
    <span id="stklLabel"></span>
    <select id="stkl">
      <option value="1">I</option>
      <option value="2">II</option>

  </div>
  <div class="group">
    <span id="churchLabel"></span>
    <select id="church">
      <option value="0"></option>
      <option value="0.08">8 %</option>
      <option value="0.09">9 %</option>
    </select>
  </div>
  <div class="group">
    <span id="kvzLabel"></span>
    <input type="number" id="kvz" value="1.7" min="0" max="5" step="0.1"> %
  </div>
</div>

<!-- Nur Leistungen -->
<div class="controls hidden" id="controlsBenefits">
  <div class="group">
    <span id="rentLabel"></span>
    <input type="number" id="rent" value="750" min="0" max="3000" step="25"> <span id="rentUnit"></span>
  </div>
  <div class="group">
    <span id="stufeLabel"></span>
    <select id="stufe">
      <option value="1">I</option>
      <option value="2">II</option>
      <option value="3">III</option>
      <option value="4" selected>IV</option>
      <option value="5">V</option>
      <option value="6">VI</option>
      <option value="7">VII</option>
    </select>
  </div>
</div>

<div class="main">

  <div class="slider-section">
    <div class="slider-label" id="sliderLabel"></div>
    <div class="slider-track" id="sliderTrack">
      <input type="range" id="incomeSlider" min="0" max="120000" value="60000" step="100">
    </div>
    <div class="income-display" id="incomeDisplay"></div>
  </div>

  <svg id="chart" width="480" height="620"></svg>

  <div class="info-panel" id="infoPanel"></div>

</div>

<footer id="footer"></footer>

<script>
// ═══ Sprachen ═══════════════════════════════════════════
const STRINGS = {
  de: {

    title: 'Deutschland · Steuern und Leistungen',
    subtitle: n => `Lohnsteuer + Sozialabgaben 2024 · Steuerklasse ${n} · Bruttolohn`,

    tabTax: 'Was man zahlt', tabBenefits: 'Was man bekommt',
    axis: 'Achse bis', stklLabel: 'Steuerklasse', regionLabel: 'Region',
    churchLabel: 'Kirchensteuer', kvzLabel: 'KV-Zusatzbeitrag',

    west: 'West', ost: 'Ost', sachsen: 'Sachsen', noChurch: 'keine',
    buergergeld: 'Bürgergeld', wohngeld: 'Wohngeld', kindergeld: 'Kindergeld',
    available: 'Verfügbar', perMonth: '€/Monat',
    benefitsCaption: 'Waagerecht = verfügbares Einkommen',

      + 'verfügbare Einkommen, aufgeteilt nach Herkunft.',
    needs: 'Bedarf', regelbedarf: 'Regelbedarf', kdu: 'Unterkunft',
    creditedIncome: 'angerechnet', allowance: 'Freibetrag',
    noClaim: 'kein Anspruch', claimUntil: 'Anspruch bis',
    benefitsNote: 'Bürgergeld geht dem Wohngeld vor: solange es einen Bürgergeld-Anspruch '
      + 'gibt, wird kein Wohngeld gezahlt.',
    gross: 'Bruttolohn', net: 'Netto', tax: 'Steuer', church: 'Kirche',
    social: 'Sozialabgaben', socialShort: 'SV',
    marginal: 'Grenzbelastung',
    capKV: 'BBG KV/PV', capRV: 'BBG RV/AV',
    caption: 'Waagerecht = Aufteilung eines Euro',
    hint: 'Slider hoch/runter ziehen — auch direkt im Diagramm',
    summary: 'Zusammenfassung', churchTax: 'Kirchensteuer',
    taxable: 'zu versteuern', burdenRate: 'Abgabenquote',
    socialCard: 'Sozialabgaben · AN-Anteil',
    pension: 'Rente', health: 'Kranken', care: 'Pflege', unemployment: 'Arbeitslos',
    footnote: (kv, rv) => `BBG 2024: ${kv} € (KV/PV) bzw. ${rv} € (RV/AV) — darüber steigen die `
      + 'Beiträge nicht mehr. RV, KV und PV mindern über die Vorsorgepauschale die Steuer.',
    byZone: 'Steuer nach Zonen', zvEShort: 'zvE',
    belowGFB: 'Unterhalb Grundfreibetrag',

      + '(§39b Abs. 2 Satz 7 EStG) statt des Zonentarifs.',
    monthly: 'Monatlich',
    zones: ['Grundfreibetrag', 'Progressionszone I', 'Progressionszone II', 'Proportionalzone', 'Reichensteuer'],
  },
  en: {
    docTitle: 'Germany · Taxes and Benefits 2024',
    title: 'Germany · Taxes and Benefits',
    subtitle: n => `Wage tax + social contributions 2024 · Tax class ${n} · gross salary`,
    subtitleBenefits: 'Citizen’s benefit, housing benefit and child benefit 2024',
    month: 'Month', year: 'Year', yearly: 'Yearly',
    perYear: '€/year', rentUnit: '€/month',
    tabTax: 'What you pay', tabBenefits: 'What you receive',
    axis: 'Axis up to', stklLabel: 'Tax class', regionLabel: 'Region',
    churchLabel: 'Church tax', kvzLabel: 'Health surcharge',
    adultsLabel: 'Adults', kidsLabel: 'Children',
    rentLabel: 'Rent incl. heating', stufeLabel: 'Rent level',
    west: 'West', ost: 'East', sachsen: 'Saxony', noChurch: 'none',
    buergergeld: 'Citizen’s benefit', wohngeld: 'Housing benefit', kindergeld: 'Child benefit',
    available: 'Available', perMonth: '€/month',
    benefitsCaption: 'Horizontal = disposable income',
    footer: 'Public domain (CC0 1.0) — do what you like with it. No warranty, and no '
      + 'substitute for actual tax or benefits advice.',
    sourceCode: 'Source on GitHub',
    hintTax: 'Read the <b>area</b>: the width is the burden on your next euro, '
      + 'the area below it is what you actually pay.',
    hintBenefits: 'Read the <b>length</b>: the bar on the slider line is your disposable '
      + 'income, split by where it comes from.',
    needs: 'Needs', regelbedarf: 'Standard needs', kdu: 'Housing',
    creditedIncome: 'credited', allowance: 'Allowance',
    noClaim: 'no entitlement', claimUntil: 'Entitled up to',
    benefitsNote: 'Citizen’s benefit takes precedence over housing benefit: while there is '
      + 'an entitlement to it, no housing benefit is paid.',
    gross: 'Gross salary', net: 'Net', tax: 'Tax', church: 'Church',
    social: 'Social contributions', socialShort: 'Social',
    marginal: 'Marginal burden',
    capKV: 'Cap health/care', capRV: 'Cap pension/unempl.',
    caption: 'Horizontal = how one euro splits',
    hint: 'Drag the slider up/down — or drag inside the chart',
    summary: 'Summary', churchTax: 'Church tax',
    taxable: 'Taxable income', burdenRate: 'Total burden',
    socialCard: 'Social contributions · employee',
    pension: 'Pension', health: 'Health', care: 'Long-term care', unemployment: 'Unemployment',
    footnote: (kv, rv) => `2024 caps: €${kv} (health/care) and €${rv} (pension/unempl.) — above them `
      + 'contributions stop growing. Pension, health and care insurance reduce the tax base.',
    byZone: 'Tax by bracket', zvEShort: 'taxable',
    belowGFB: 'Below basic allowance',
    noZones: 'Tax classes V and VI use their own formula '
      + '(§39b (2) sentence 7 EStG) instead of the bracket tariff.',
    monthly: 'Monthly',
    zones: ['Basic allowance', 'Progressive zone I', 'Progressive zone II', 'Proportional zone', 'Top rate'],
  },

const savedPeriod = localStorage.getItem('taxPeriod');
let lang = (localStorage.getItem('taxLang')
  || (navigator.language || 'de').slice(0, 2).toLowerCase()) === 'de' ? 'de' : 'en';
const t = k => STRINGS[lang][k];
const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];
const REPO_URL    = 'https://github.com/WhiteBlackGoose/germany-finances';
const LICENSE_URL = 'https://creativecommons.org/publicdomain/zero/1.0/';

// ═══ Einkommensteuertarif 2024 (§32a EStG) ══════════════
// Stetige Fassung (ohne die gesetzliche Abrundung), damit Fläche und
// Grenzbelastung im Diagramm exakt zusammenpassen.
const GFB    = 11604;
const Z2_END = 17005;
const Z3_END = 66760;
const Z4_END = 277825;

// Die Konstanten der oberen Zonen sind im Gesetz auf zwei Nachkommastellen
// gerundet (1025,38 / −10602,13 / −18936,88), wodurch der Tarif an den
// Zonengrenzen um wenige Cent springt. Bei der gesetzlichen Abrundung auf volle
// Euro fällt das nicht auf, eine numerische Ableitung macht daraus aber einen
// Ausschlag von mehreren Prozentpunkten. Daher hier aus der Stetigkeitsbedingung
// hergeleitet — die Steuer weicht dadurch um höchstens 5 Cent ab.
const zone2 = zvE => { const y = (zvE - GFB) / 10000; return (922.98 * y + 1400) * y; };
const C2 = zone2(Z2_END);                                    // ≈ 1025,3807
const zone3 = zvE => { const z = (zvE - Z2_END) / 10000; return (181.19 * z + 2397) * z + C2; };
const C3 = zone3(Z3_END) - 0.42 * Z3_END;                    // ≈ −10602,08
const C4 = (0.42 * Z4_END + C3) - 0.45 * Z4_END;             // ≈ −18936,83

function tarif(zvE) {
  if (zvE <= GFB)    return 0;
  if (zvE <= Z2_END) return zone2(zvE);
  if (zvE <= Z3_END) return zone3(zvE);
  if (zvE <= Z4_END) return 0.42 * zvE + C3;
  return 0.45 * zvE + C4;
}

const ZONES = [
  { i: 0, rateLabel: '0 %',     min: 0,      max: GFB,      color: null      },
  { i: 1, rateLabel: '14–24 %', min: GFB,    max: Z2_END,   color: '#f0abfc' },
  { i: 2, rateLabel: '24–42 %', min: Z2_END, max: Z3_END,   color: '#c084fc' },
  { i: 3, rateLabel: '42 %',    min: Z3_END, max: Z4_END,   color: '#7c3aed' },
  { i: 4, rateLabel: '45 %',    min: Z4_END, max: Infinity, color: '#4c1d95' },
];
const FLAT_TAX_COLOR = '#a855f7';   // Steuerklassen V/VI: kein Zonentarif

// ═══ Parameter 2024 (Programmablaufplan des BMF) ════════
const BBG_KVPV   = 62100;
const BBG_RV_W   = 90600;
const BBG_RV_O   = 89400;
const R_RV       = 0.093;    // AN-Anteil Rentenversicherung
const R_AV       = 0.013;    // AN-Anteil Arbeitslosenversicherung
const KV_ALLG    = 0.073;    // AN-Anteil KV, allgemeiner Beitragssatz
const KV_ERM     = 0.070;    // ermäßigter Satz — maßgeblich für die Vorsorgepauschale
const PV_NORMAL  = 0.017;
const PV_SACHSEN = 0.022;
const PV_ZUSCHLAG = 0.006;   // Kinderlose, trägt der AN allein
const ANP = 1230, SAP = 36, EFA = 4260;
// Grenzwerte der Steuerklassen V/VI (§39b Abs. 2 Satz 7 EStG)
const W1 = 13279, W2 = 33380, W3 = 222260;

// ═══ Einstellungen ══════════════════════════════════════
let view      = 'tax';
let period    = savedPeriod === 'month' ? 'month' : 'year';
let stkl      = 1;
let region    = 'west';
let churchTax = 0;
let kvz       = 1.7;
let adults    = 1;
let kids      = 0;
let rent      = 750;
let stufe     = 4;
const childless = () => kids === 0;

const bbgRV   = () => region === 'west' ? BBG_RV_W : BBG_RV_O;
const kvPaid  = () => KV_ALLG + kvz / 200;         // tatsächlich gezahlt
const kvDed   = () => KV_ERM  + kvz / 200;         // steuerlich abziehbar
const pvBase  = () => region === 'sachsen' ? PV_SACHSEN : PV_NORMAL;
const pvPaid  = () => pvBase() + (childless() ? PV_ZUSCHLAG : 0);

// ── Sozialabgaben (Arbeitnehmeranteil) ──
function socialParts(gross) {
  const bRV = Math.min(gross, bbgRV());
  const bKV = Math.min(gross, BBG_KVPV);
  const rv = R_RV * bRV, av = R_AV * bRV;
  const kv = kvPaid() * bKV, pv = pvPaid() * bKV;
  return { rv, av, kv, pv, total: rv + av + kv + pv };
}
const socialOf = g => socialParts(g).total;

// ── Vorsorgepauschale (§39b Abs. 2 Satz 5 Nr. 3 EStG) ──
// Teilbetrag RV plus Teilbetrag KV/PV, letzterer mindestens die
// Mindestvorsorgepauschale von 12 % des Arbeitslohns (Höchstbetrag 1.900 €,
// in Steuerklasse III 3.000 €).
function vorsorgepauschale(gross) {
  const vsp1 = R_RV * Math.min(gross, bbgRV());
  const vhb  = stkl === 3 ? 3000 : 1900;
  const mind = Math.min(0.12 * gross, vhb);
  const kvpv = (kvDed() + pvBase()) * Math.min(gross, BBG_KVPV);
  return vsp1 + Math.max(kvpv, mind);
}

function zvEOf(gross) {
  const anp = stkl === 6 ? 0 : ANP;
  const sap = stkl === 6 ? 0 : SAP;
  const efa = stkl === 2 ? EFA : 0;
  return Math.max(0, gross - (anp + sap + efa) - vorsorgepauschale(gross));
}

// ── Lohnsteuer der Steuerklassen V und VI ──
function up56(zx) {
  const diff = 2 * (tarif(zx * 1.25) - tarif(zx * 0.75));
  return Math.max(diff, zx * 0.14);          // Mindeststeuer
}

function mst56(zvE) {
  if (zvE > W2) {
    let st = up56(W2);
    st += zvE > W3 ? (W3 - W2) * 0.42 + (zvE - W3) * 0.45
                   : (zvE - W2) * 0.42;
    return st;
  }
  const vergl = up56(zvE);
  if (zvE <= W1) return vergl;
  return Math.min(up56(W1) + (zvE - W1) * 0.42, vergl);   // Höchststeuer
}

const KZTAB = () => stkl === 3 ? 2 : 1;

function lohnsteuer(zvE) {
  if (stkl >= 5) return mst56(zvE);
  const k = KZTAB();
  return tarif(zvE / k) * k;                  // Splitting in Steuerklasse III
}

const taxOf    = g => lohnsteuer(zvEOf(g));
const churchOf = g => churchTax * taxOf(g);

// ── Grenzbelastungen: numerische Ableitung der stetigen Funktionen ──
function slope(f, v) {
  const h = 0.5;
  return v < h ? (f(h) - f(0)) / h : (f(v + h) - f(v - h)) / (2 * h);
}
const mSocial = v => slope(socialOf, v);
const mTax    = v => slope(taxOf, v);
const mChurch = v => slope(churchOf, v);

// Brutto, bei dem ein bestimmtes zvE erreicht wird (zvEOf ist monoton)
function grossAtZvE(target) {
  let lo = 0, hi = 2e6;
  for (let i = 0; i < 60; i++) {
    const mid = (lo + hi) / 2;
    if (zvEOf(mid) < target) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

function breakdown(zvE) {
  const k = KZTAB();
  return ZONES.map(z => {
    const min = z.min * k, max = z.max * k;
    if (zvE <= min) return null;
    const incomeInZone = Math.min(zvE, max) - min;
    const taxFromZone  = lohnsteuer(Math.min(zvE, max)) - lohnsteuer(min);
    return { ...z, incomeInZone, taxFromZone };
  }).filter(Boolean);
}

// ═══ Staatliche Leistungen 2024 ═════════════════════════
const KINDERGELD = 250;              // je Kind und Monat

// Regelbedarfe SGB II 2024. Kinder werden pauschal mit der Stufe 6–13 Jahre
// angesetzt (357 € für 0–5, 471 € für 14–17 wären die anderen Stufen).
const RB_SINGLE = 563, RB_PARTNER = 506, RB_KIND = 390;

// Wohngeld: Parameter a, b, c der Formel in §19 Abs. 1 WoGG (Anlage 2),
// Index = Haushaltsgröße − 1.
const WG_ABC = [
  [0.04, 0.0004797, 0.0000408], [0.03, 0.0003571, 0.0000304],
  [0.02, 0.0002917, 0.0000245], [0.01, 0.0002163, 0.0000176],
  [0.00, 0.0001907, 0.0000172], [-0.01, 0.0001722, 0.0000166],
  [-0.02, 0.0001592, 0.0000165], [-0.03, 0.0001583, 0.0000165],
  [-0.04, 0.0001376, 0.0000166], [-0.06, 0.0001249, 0.0000166],
  [-0.09, 0.0001141, 0.0000196], [-0.12, 0.0001107, 0.0000221],
];
// Höchstbeträge für Miete nach Mietenstufe I–VII (§12 Abs. 1 WoGG, Anlage 1)
const WG_MAX = [
  [361, 408, 456, 511, 562, 615, 677],
  [437, 493, 551, 619, 680, 745, 820],
  [521, 587, 657, 737, 809, 887, 975],
  [608, 686, 766, 858, 946, 1035, 1139],
  [694, 782, 875, 982, 1080, 1183, 1302],
];
const WG_PLUS = [82, 94, 106, 119, 129, 149, 163];   // je weitere Person

const householdSize = () => Math.min(adults + kids, 12);

function wgMaxRent() {
  const n = householdSize(), s = stufe - 1;
  return n <= 5 ? WG_MAX[n - 1][s] : WG_MAX[4][s] + (n - 5) * WG_PLUS[s];
}

// Monatliches Nettoeinkommen aus der Steuer-/Abgabenrechnung
const netMonthly = g => (g - taxOf(g) - churchOf(g) - socialOf(g)) / 12;

const kindergeld = () => KINDERGELD * kids;

const bedarf = () => (adults === 1 ? RB_SINGLE : 2 * RB_PARTNER) + kids * RB_KIND + rent;

// Einkommensanrechnung nach §11b SGB II — der Freibetrag bleibt anrechnungsfrei
function anrechenbar(net) {
  if (net <= 100) return 0;
  let frei = 100;
  frei += 0.20 * (Math.min(net, 520) - 100);
  if (net > 520)  frei += 0.30 * (Math.min(net, 1000) - 520);
  const grenze = kids > 0 ? 1500 : 1200;
  if (net > 1000) frei += 0.10 * (Math.min(net, grenze) - 1000);
  return Math.max(0, net - frei);
}

const buergergeld = g => Math.max(0, bedarf() - anrechenbar(netMonthly(g)) - kindergeld());

// Wohngeld nach §19 WoGG. Das wohngeldrechtliche Einkommen ist grob das
// Bruttoeinkommen abzüglich Werbungskostenpauschale und der 30 % Pauschalabzug
// für Steuern, Kranken- und Rentenversicherung (§16 WoGG).
function wohngeld(g) {
  if (buergergeld(g) > 0) return 0;                  // Bürgergeld geht vor
  const M = Math.min(rent, wgMaxRent());
  const Y = Math.max(0, (g - ANP) * 0.7 / 12);
  const [a, b, c] = WG_ABC[householdSize() - 1];
  return Math.max(0, 1.15 * (M - (a + b * M + c * Y) * Y));
}

// Verfügbar pro Monat: Netto plus alle Leistungen
const stack = g => {
  const bg = buergergeld(g);
  return { net: netMonthly(g), kg: kindergeld(), wg: wohngeld(g), bg };
};
const available = g => { const s = stack(g); return s.net + s.kg + s.wg + s.bg; };

const BENEFIT_COLORS = { net: '#ebebeb', kg: '#fbbf24', wg: '#60a5fa', bg: '#34d399' };

// ═══ Geometrie ══════════════════════════════════════════
const SVG_W = 480, SVG_H = 620;
const PAD_L = 52, PAD_R = 64, PAD_T = 22, PAD_B = 78;
const PLOT_X0 = PAD_L, PLOT_X1 = SVG_W - PAD_R, PLOT_W = PLOT_X1 - PLOT_X0;
const PLOT_Y0 = PAD_T, PLOT_Y1 = SVG_H - PAD_B, PLOT_H = PLOT_Y1 - PLOT_Y0;

let axisMax = 120000;
let gross   = 60000;

const yOf = v => PLOT_Y1 - (v / axisMax) * PLOT_H;
const xOf = f => PLOT_X0 + Math.max(0, Math.min(1, f)) * PLOT_W;

// Grenzlinien: Netto | Sozialabgaben | Steuer | Kirchensteuer
const xA = v => xOf(1 - mSocial(v) - mTax(v) - mChurch(v));
const xB = v => xOf(1 - mTax(v) - mChurch(v));
const xC = v => xOf(1 - mChurch(v));
const edgeL = () => PLOT_X0;
const edgeR = () => PLOT_X1;

const svgNS = 'http://www.w3.org/2000/svg';
const chart = document.getElementById('chart');

function el(tag, attrs = {}, text = null) {
  const e = document.createElementNS(svgNS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== null) e.textContent = text;
  return e;
}
const add = (tag, attrs, text) => { const e = el(tag, attrs, text); chart.appendChild(e); return e; };

const loc    = () => lang === 'de' ? 'de-DE' : 'en-GB';
const num    = n => Math.round(n).toLocaleString(loc());
const fmt    = n => num(n) + ' €';
const fmtPct = r => {
  const s = (r * 100).toFixed(1);
  return (lang === 'de' ? s.replace('.', ',') : s) + ' %';
};
const fmtRate = r => {
  const s = (r * 100).toFixed(2).replace(/0$/, '').replace(/\.$/, '');
  return (lang === 'de' ? s.replace('.', ',') : s) + ' %';
};
const fmtK = v => {
  if (v < 1000) return String(Math.round(v));
  const s = (v / 1000).toFixed(1).replace('.0', '');
  return (lang === 'de' ? s.replace('.', ',') : s) + 'k';
};

// Intern rechnet der Steuerteil in Jahres-, der Leistungsteil in Monatsbeträgen —
// angezeigt wird alles im gewählten Zeitraum.
const perY = n => period === 'month' ? n / 12 : n;      // n liegt jährlich vor
const perM = n => period === 'year'  ? n * 12 : n;      // n liegt monatlich vor
const fmtY  = n => fmt(perY(n));
const fmtM  = n => fmt(perM(n));
const fmtKY = v => fmtK(perY(v));
const fmtKM = v => fmtK(perM(v));
const otherPeriod = () => period === 'month' ? 'yearly' : 'monthly';
const unitLabel   = () => period === 'month' ? t('perMonth') : t('perYear');

// Alle Knick- und Sprungstellen in Brutto-Koordinaten
function breakpoints() {
  const k = KZTAB();
  const zvEEdges = stkl >= 5
    ? [W1, W2, W3, GFB / 1.25, GFB / 0.75, Z2_END / 1.25, Z2_END / 0.75, Z3_END / 1.25]
    : [GFB * k, Z2_END * k, Z3_END * k, Z4_END * k];
  // Der Abstand muss größer sein als das Fenster von slope(), sonst wird an
  // jedem Knick ein gemittelter Zwischenwert gezeichnet statt der scharfen Kante.
  const eps = 0.6;
  const bp = [];
  for (const e of zvEEdges) {
    const g = grossAtZvE(e);
    bp.push(g - eps, g + eps);
  }
  const vhb = stkl === 3 ? 3000 : 1900;
  bp.push(BBG_KVPV - eps, BBG_KVPV + eps, bbgRV() - eps, bbgRV() + eps);
  bp.push(vhb / 0.12, vhb / (kvDed() + pvBase()));    // Mindestvorsorgepauschale
  return bp;
}

function samples(v0, v1) {
  const set = new Set([v0, v1]);
  const step = Math.max((v1 - v0) / 400, 1);
  for (let v = v0; v < v1; v += step) set.add(v);
  for (const b of breakpoints()) if (b > v0 && b < v1) set.add(b);
  return [...set].sort((a, b) => a - b);
}

function bandPath(v0, v1, fLeft, fRight) {
  const vs = samples(v0, v1);
  let d = '';
  vs.forEach((v, i) => { d += (i ? 'L' : 'M') + fLeft(v).toFixed(2) + ' ' + yOf(v).toFixed(2); });
  for (let i = vs.length - 1; i >= 0; i--) {
    d += 'L' + fRight(vs[i]).toFixed(2) + ' ' + yOf(vs[i]).toFixed(2);
  }
  return d + 'Z';
}

function linePath(f, v0, v1) {
  let d = '';
  samples(v0, v1).forEach((v, i) => { d += (i ? 'L' : 'M') + f(v).toFixed(2) + ' ' + yOf(v).toFixed(2); });
  return d;
}

function drawBands(zonesInGross, v0, v1, fLeft, fRight, opacity) {
  for (const z of zonesInGross) {
    if (!z.color) continue;
    const lo = Math.max(z.lo, v0), hi = Math.min(z.hi, v1, axisMax);
    if (hi - lo < 0.5) continue;
    add('path', {
      d: bandPath(lo + 0.001, hi, fLeft, fRight),
      fill: z.color, opacity,
      stroke: z.color, 'stroke-width': 0.6, 'stroke-opacity': opacity
    });
  }
}

// Steuerzonen in Brutto-Koordinaten; in V/VI gibt es keinen Zonentarif
function taxZonesGross() {
  if (stkl >= 5) return [{ color: FLAT_TAX_COLOR, lo: 0, hi: Infinity, rateLabel: null }];
  const k = KZTAB();
  return ZONES.map(z => ({
    ...z,
    lo: grossAtZvE(z.min * k),
    hi: z.max === Infinity ? Infinity : grossAtZvE(z.max * k),
  }));
}
const svZonesGross = () => [
  { color: '#2dd4bf', lo: 0,        hi: BBG_KVPV },
  { color: '#0d9488', lo: BBG_KVPV, hi: bbgRV()  },
];

// ═══ Rendering ══════════════════════════════════════════
function render() {
  if (view === 'benefits') renderBenefits(); else renderTax();
}

// ── Ansicht „Was man bekommt" ──
// Waagerecht steht hier ein Betrag (€/Monat), nicht ein Anteil: gestapelt
// Netto, Kindergeld, Wohngeld und Bürgergeld über dem Bruttoeinkommen.
function renderBenefits() {
  chart.innerHTML = '';
  add('rect', { x: 0, y: 0, width: SVG_W, height: SVG_H, fill: '#161b22', rx: 12 });

  // Betragsachse so skalieren, dass der gesamte Bereich hineinpasst
  const probe = [];
  for (let i = 0; i <= 60; i++) probe.push(available(axisMax * i / 60));
  const xMax = Math.max(500, Math.ceil(Math.max(...probe) * 1.06 / 250) * 250);
  const bx = a => PLOT_X0 + Math.max(0, Math.min(1, a / xMax)) * PLOT_W;

  const vs = [];
  for (let i = 0; i <= 500; i++) vs.push(axisMax * i / 500);
  // Sprungstelle Bürgergeld → Wohngeld genau treffen
  let edge = null;
  for (let i = 1; i < vs.length; i++) {
    if (buergergeld(vs[i - 1]) > 0 && buergergeld(vs[i]) <= 0) {
      let lo = vs[i - 1], hi = vs[i];
      for (let k = 0; k < 40; k++) {
        const mid = (lo + hi) / 2;
        if (buergergeld(mid) > 0) lo = mid; else hi = mid;
      }
      edge = lo;
      vs.push(lo, hi);
      vs.sort((a, b) => a - b);
      break;
    }
  }

  // Gestapelte Flächen. Die Leistungen stehen links, damit sie als ruhige
  // Streifen ablesbar bleiben — das wachsende Netto schiebt sich rechts davor.
  const keys = ['bg', 'wg', 'kg', 'net'];
  const cum = vs.map(v => {
    const s = stack(v);
    const c = [0];
    for (const k of keys) c.push(c[c.length - 1] + s[k]);
    return c;
  });

  keys.forEach((k, idx) => {
    let d = '';
    vs.forEach((v, i) => { d += (i ? 'L' : 'M') + bx(cum[i][idx]).toFixed(2) + ' ' + yOf(v).toFixed(2); });
    for (let i = vs.length - 1; i >= 0; i--) {
      d += 'L' + bx(cum[i][idx + 1]).toFixed(2) + ' ' + yOf(vs[i]).toFixed(2);
    }
    add('path', { d: d + 'Z', fill: BENEFIT_COLORS[k], opacity: k === 'net' ? 1 : 0.92 });
  });

  // Umriss des verfügbaren Einkommens
  let outline = '';
  vs.forEach((v, i) => {
    outline += (i ? 'L' : 'M') + bx(cum[i][4]).toFixed(2) + ' ' + yOf(v).toFixed(2);
  });
  add('path', { d: outline, fill: 'none', stroke: '#e6edf3', 'stroke-width': 1.6, opacity: 0.85 });

  // Vergleichslinie: Bruttoeinkommen selbst
  let brut = '';
  vs.forEach((v, i) => { brut += (i ? 'L' : 'M') + bx(v / 12).toFixed(2) + ' ' + yOf(v).toFixed(2); });
  add('path', { d: brut, fill: 'none', stroke: '#8b949e', 'stroke-width': 1,
    'stroke-dasharray': '4,4', opacity: 0.6 });

  // ── Achsen ──
  add('line', { x1: PLOT_X0, y1: PLOT_Y0, x2: PLOT_X0, y2: PLOT_Y1, stroke: '#30363d' });
  add('line', { x1: PLOT_X0, y1: PLOT_Y1, x2: PLOT_X1, y2: PLOT_Y1, stroke: '#30363d' });

  const yStep = axisMax <= 30000 ? 5000 : axisMax <= 60000 ? 10000 : 20000;
  for (let v = 0; v <= axisMax; v += yStep) {
    const y = yOf(v);
    if (v > 0) add('line', { x1: PLOT_X0, y1: y, x2: PLOT_X1, y2: y,
      stroke: '#30363d', 'stroke-width': 0.8, 'stroke-dasharray': '3,3', opacity: 0.5 });
    add('text', { x: PLOT_X0 - 6, y, 'text-anchor': 'end', 'dominant-baseline': 'middle',
      fill: '#8b949e', 'font-size': 8.5 }, v === 0 ? '0' : fmtKY(v));
  }

  const xStep = xMax <= 1500 ? 250 : xMax <= 4000 ? 500 : 1000;
  for (let a = 0; a <= xMax; a += xStep) {
    const x = bx(a);
    if (a > 0) add('line', { x1: x, y1: PLOT_Y0, x2: x, y2: PLOT_Y1,
      stroke: '#30363d', 'stroke-width': 0.7, 'stroke-dasharray': '2,4', opacity: 0.35 });
    add('text', { x, y: PLOT_Y1 + 14, 'text-anchor': 'middle', fill: '#8b949e', 'font-size': 8.5 },
      a === 0 ? '0' : fmtKM(a));
  }

  // Grenze Bürgergeld → Wohngeld
  if (edge !== null && edge > 0 && edge < axisMax) {
    const y = yOf(edge);
    add('line', { x1: PLOT_X0, y1: y, x2: PLOT_X1, y2: y,
      stroke: '#34d399', 'stroke-width': 0.9, 'stroke-dasharray': '2,3', opacity: 0.8 });
    add('text', { x: PLOT_X1 - 4, y: y - 4, 'text-anchor': 'end',
      fill: '#34d399', 'font-size': 8, opacity: 0.9 }, t('claimUntil') + ' ' + fmtY(edge));
  }

  // ── Beschriftung der Bänder ──
  const lineY = yOf(gross);
  const label = (key, text) => {
    const idx = keys.indexOf(key);
    // Stelle mit der größten Bandbreite suchen
    let best = 0, bestW = 0;
    for (let i = 0; i < vs.length; i++) {
      const w = cum[i][idx + 1] - cum[i][idx];
      if (w > bestW) { bestW = w; best = i; }
    }
    if (bx(bestW) - PLOT_X0 < 46) return;
    const cx = (bx(cum[best][idx]) + bx(cum[best][idx + 1])) / 2;
    let cy = Math.max(PLOT_Y0 + 12, Math.min(PLOT_Y1 - 12, yOf(vs[best])));
    // der Sliderlinie ausweichen
    if (Math.abs(cy - lineY) < 18) cy = lineY + (cy < lineY ? -24 : 24);
    add('text', { x: cx, y: cy, 'text-anchor': 'middle', 'dominant-baseline': 'middle',
      fill: '#1a1a2e', 'font-size': 10.5, 'font-weight': 700,
      stroke: 'rgba(255,255,255,0.4)', 'stroke-width': 2.4, 'paint-order': 'stroke'
    }, text);
  };
  label('bg', t('buergergeld'));
  label('wg', t('wohngeld'));
  label('kg', t('kindergeld'));
  label('net', t('net'));

  // ── Slider: die Linie selbst ist die Aufteilung ──
  const s = stack(gross);
  const cuts = [0];
  for (const k of keys) cuts.push(cuts[cuts.length - 1] + s[k]);
  const xTip = bx(cuts[4]);

  // Rest der Achse hinter dem verfügbaren Einkommen
  add('line', { x1: xTip, y1: lineY, x2: PLOT_X1 + 8, y2: lineY,
    stroke: '#a855f7', 'stroke-width': 1.2, opacity: 0.35 });
  add('line', { x1: PLOT_X0 - 8, y1: lineY, x2: PLOT_X0, y2: lineY,
    stroke: '#a855f7', 'stroke-width': 2 });
  add('circle', { cx: PLOT_X0 - 8, cy: lineY, r: 4, fill: '#a855f7' });
  add('circle', { cx: PLOT_X1 + 8, cy: lineY, r: 4, fill: '#a855f7', opacity: 0.35 });

  // Abschnitt je Leistung, in der Farbe des jeweiligen Bandes
  keys.forEach((k, i) => {
    if (cuts[i + 1] - cuts[i] < 0.5) return;
    add('line', { x1: bx(cuts[i]), y1: lineY, x2: bx(cuts[i + 1]), y2: lineY,
      stroke: BENEFIT_COLORS[k], 'stroke-width': 4, 'stroke-linecap': 'butt' });
  });
  // Übergänge markieren
  for (let i = 1; i <= 3; i++) {
    if (cuts[i] - cuts[i - 1] < 0.5 || cuts[i + 1] - cuts[i] < 0.5) continue;
    add('circle', { cx: bx(cuts[i]), cy: lineY, r: 3.4,
      fill: '#161b22', stroke: '#e6edf3', 'stroke-width': 1.4 });
  }
  add('circle', { cx: xTip, cy: lineY, r: 5, fill: '#161b22', stroke: '#a855f7', 'stroke-width': 2 });

  // Beträge unter den Abschnitten
  keys.forEach((k, i) => {
    const w = bx(cuts[i + 1]) - bx(cuts[i]);
    if (w < 36) return;
    add('text', { x: (bx(cuts[i]) + bx(cuts[i + 1])) / 2, y: lineY + 15, 'text-anchor': 'middle',
      fill: '#0d1117', 'font-size': 8.5, 'font-weight': 700,
      stroke: 'rgba(255,255,255,0.65)', 'stroke-width': 2.4, 'paint-order': 'stroke'
    }, fmtM(s[k]));
  });

  const left = xTip > PLOT_X0 + PLOT_W * 0.6;
  add('text', {
    x: xTip + (left ? -10 : 10), y: lineY - 10, 'text-anchor': left ? 'end' : 'start',
    fill: '#a855f7', 'font-size': 10, 'font-weight': 700,
    stroke: '#161b22', 'stroke-width': 2.6, 'paint-order': 'stroke'
  }, t('available') + ' ' + fmtM(available(gross)));

  add('text', { x: SVG_W / 2, y: PLOT_Y1 + 50, 'text-anchor': 'middle',
    fill: '#8b949e', 'font-size': 9 }, t('benefitsCaption') + ' · ' + unitLabel());
  add('text', { x: SVG_W / 2, y: PLOT_Y1 + 63, 'text-anchor': 'middle',
    fill: '#6b7280', 'font-size': 8.5 }, t('hint'));

  updatePanelBenefits(s, edge);
}

function renderTax() {
  chart.innerHTML = '';

  const zvE    = zvEOf(gross);
  const tax    = taxOf(gross);
  const kirche = churchOf(gross);
  const sv     = socialParts(gross);
  const net    = gross - tax - kirche - sv.total;
  const zones  = stkl >= 5 ? [] : breakdown(zvE);
  const mAll   = mSocial(gross) + mTax(gross) + mChurch(gross);
  const lineY  = yOf(gross);
  const taxZ   = taxZonesGross();

  add('rect', { x: 0, y: 0, width: SVG_W, height: SVG_H, fill: '#161b22', rx: 12 });

  // ── Ausblick oberhalb des Sliders ──
  if (gross < axisMax) {
    add('path', { d: bandPath(gross, axisMax, edgeL, xA), fill: '#ebebeb', opacity: 0.035 });
    drawBands(svZonesGross(), gross, axisMax, xA, xB, 0.13);
    drawBands(taxZ,           gross, axisMax, xB, xC, 0.13);
    if (churchTax) add('path', { d: bandPath(gross, axisMax, xC, edgeR), fill: '#f59e0b', opacity: 0.13 });
  }

  // ── bezahlter Bereich ──
  if (gross > 0) {
    add('path', { d: bandPath(0, gross, edgeL, xA), fill: '#ebebeb' });
    drawBands(svZonesGross(), 0, gross, xA, xB, 1);
    drawBands(taxZ,           0, gross, xB, xC, 1);
    if (churchTax) add('path', { d: bandPath(0, gross, xC, edgeR), fill: '#f59e0b' });
  }

  // ── Grenzlinien ──
  if (churchTax) {
    add('path', { d: linePath(xC, 0, axisMax), fill: 'none',
      stroke: '#e6edf3', 'stroke-width': 1, 'stroke-linejoin': 'round', opacity: 0.4 });
  }
  add('path', { d: linePath(xB, 0, axisMax), fill: 'none',
    stroke: '#e6edf3', 'stroke-width': 1.1, 'stroke-linejoin': 'round', opacity: 0.5 });
  add('path', { d: linePath(xA, 0, axisMax), fill: 'none',
    stroke: '#e6edf3', 'stroke-width': 1.6, 'stroke-linejoin': 'round', opacity: 0.85 });

  // ── Y-Achse ──
  add('line', { x1: PLOT_X0, y1: PLOT_Y0, x2: PLOT_X0, y2: PLOT_Y1, stroke: '#30363d' });

  const k = KZTAB();
  const ticks = [0, ...(stkl >= 5 ? [W1, W2] : [GFB, Z2_END, Z3_END, Z4_END].map(z => z * k))
    .map(grossAtZvE), axisMax].filter(v => v <= axisMax).sort((a, b) => a - b);
  let lastLabelY = Infinity;
  for (const tv of ticks) {
    const y = yOf(tv);
    if (tv > 0 && tv < axisMax) {
      add('line', { x1: PLOT_X0, y1: y, x2: PLOT_X1, y2: y,
        stroke: '#30363d', 'stroke-width': 0.8, 'stroke-dasharray': '3,3', opacity: 0.55 });
    }
    if (lastLabelY - y < 11) continue;
    lastLabelY = y;
    add('text', { x: PLOT_X0 - 6, y, 'text-anchor': 'end', 'dominant-baseline': 'middle',
      fill: '#8b949e', 'font-size': 8.5 }, tv === 0 ? '0' : fmtKY(tv));
  }

  // ── Beitragsbemessungsgrenzen ──
  for (const [v, name] of [[BBG_KVPV, t('capKV')], [bbgRV(), t('capRV')]]) {
    if (v > axisMax) continue;
    const y = yOf(v);
    add('line', { x1: PLOT_X0, y1: y, x2: PLOT_X1, y2: y,
      stroke: '#2dd4bf', 'stroke-width': 0.9, 'stroke-dasharray': '2,3', opacity: 0.75 });
    add('text', { x: PLOT_X0 + 5, y: y - 4, fill: '#2dd4bf', 'font-size': 8, opacity: 0.9 },
      name + ' ' + fmtKY(v));
  }

  // ── Steuerzonen im rechten Rand ──
  let lastZoneY = -Infinity;
  for (const z of [...taxZ].reverse()) {
    if (!z.rateLabel) continue;
    const lo = Math.max(z.lo, 0), hi = Math.min(z.hi, axisMax);
    if (hi - lo < 1) continue;
    const yMid = yOf((lo + hi) / 2);
    add('line', { x1: PLOT_X1, y1: yOf(hi), x2: PLOT_X1 + 5, y2: yOf(hi),
      stroke: '#30363d', 'stroke-width': 0.8 });
    if (yMid - lastZoneY < 12) continue;
    lastZoneY = yMid;
    add('text', { x: PLOT_X1 + 8, y: yMid, 'dominant-baseline': 'middle',
      fill: z.color ?? '#6b7280', 'font-size': 9, 'font-weight': z.color ? 700 : 400,
      opacity: gross > z.lo ? 1 : 0.45 }, z.rateLabel);
  }

  // ── Flächenbeschriftung ──
  const outlined = (x, y, text, size, weight, opacity) => add('text', {
    x, y, 'text-anchor': 'middle', fill: '#fff',
    stroke: 'rgba(0,0,0,0.4)', 'stroke-width': size > 11 ? 2.6 : 2.4,
    'paint-order': 'stroke', 'font-size': size, 'font-weight': weight, opacity
  }, text);

  if (gross > 0 && PLOT_Y1 - lineY > 46) {
    const vN = gross * 0.55;
    if (xA(vN) - PLOT_X0 > 54) {
      add('text', { x: (PLOT_X0 + xA(vN)) / 2, y: yOf(vN) - 5, 'text-anchor': 'middle',
        fill: '#1a1a2e', 'font-size': 13, 'font-weight': 700 }, t('net'));
      add('text', { x: (PLOT_X0 + xA(vN)) / 2, y: yOf(vN) + 10, 'text-anchor': 'middle',
        fill: '#4a4a5e', 'font-size': 9.5 }, fmtY(net));
    }

    const vT = gross * 0.5;
    if (xC(vT) - xB(vT) > 66) {
      outlined((xB(vT) + xC(vT)) / 2, yOf(vT) - 5, t('tax'), 13, 700, 1);
      outlined((xB(vT) + xC(vT)) / 2, yOf(vT) + 10, fmtY(tax), 9.5, 400, 0.92);
    }

    const vS = Math.min(gross, BBG_KVPV) * 0.5;
    if (vS < gross && xB(vS) - xA(vS) > 74) {
      outlined((xA(vS) + xB(vS)) / 2, yOf(vS) - 4, t('social'), 10.5, 700, 1);
      outlined((xA(vS) + xB(vS)) / 2, yOf(vS) + 9, fmtY(sv.total), 9, 400, 0.92);
    }
  }

  // ── Effektive Aufteilung: flächengleiche Senkrechte ──
  const cut = amount => xOf(gross > 0 ? 1 - amount / gross : 1);
  const xEffNet    = cut(tax + kirche + sv.total);
  const xEffSocial = cut(tax + kirche);
  const xEffTax    = cut(kirche);
  if (gross > 0) {
    const lines = churchTax ? [xEffNet, xEffSocial, xEffTax] : [xEffNet, xEffSocial];
    for (const x of lines) {
      add('line', { x1: x, y1: lineY, x2: x, y2: PLOT_Y1,
        stroke: '#0d1117', 'stroke-width': 1, 'stroke-dasharray': '4,3', opacity: 0.5 });
    }
  }

  // ── Slider ──
  add('line', { x1: PLOT_X0 - 8, y1: lineY, x2: PLOT_X1 + 8, y2: lineY,
    stroke: '#a855f7', 'stroke-width': 2 });
  add('circle', { cx: PLOT_X0 - 8, cy: lineY, r: 4, fill: '#a855f7' });
  add('circle', { cx: PLOT_X1 + 8, cy: lineY, r: 4, fill: '#a855f7' });

  const xCut = xA(gross);
  add('circle', { cx: xCut, cy: lineY, r: 4.5, fill: '#0d1117', stroke: '#a855f7', 'stroke-width': 2 });
  const labelLeft = xCut > PLOT_X0 + PLOT_W * 0.6;
  add('text', {
    x: xCut + (labelLeft ? -10 : 10), y: lineY - 9,
    'text-anchor': labelLeft ? 'end' : 'start',
    fill: '#a855f7', 'font-size': 10, 'font-weight': 700,
    stroke: '#161b22', 'stroke-width': 2.6, 'paint-order': 'stroke'
  }, t('marginal') + ' ' + fmtPct(mAll));

  // ── X-Achse mit effektiver Aufteilung ──
  add('line', { x1: PLOT_X0, y1: PLOT_Y1, x2: PLOT_X1, y2: PLOT_Y1, stroke: '#30363d' });

  const by = PLOT_Y1 + 16;
  const bracket = (x0, x1, color, label, allowOutside) => {
    if (x1 - x0 < 1) return;
    add('line', { x1: x0, y1: by, x2: x1, y2: by, stroke: color, 'stroke-width': 2 });
    add('line', { x1: x0, y1: by - 3, x2: x0, y2: by + 3, stroke: color, 'stroke-width': 2 });
    add('line', { x1: x1, y1: by - 3, x2: x1, y2: by + 3, stroke: color, 'stroke-width': 2 });
    const wide = x1 - x0 > 46;
    if (!wide && !allowOutside) return;
    add('text', { x: wide ? (x0 + x1) / 2 : SVG_W - 6, y: by + 15,
      'text-anchor': wide ? 'middle' : 'end',
      fill: color, 'font-size': 9.5, 'font-weight': 600 }, label);
  };
  const share = v => gross > 0 ? fmtPct(v / gross) : '–';
  bracket(PLOT_X0,   xEffNet,    '#ebebeb', t('net') + ' ' + share(net), false);
  bracket(xEffNet,   xEffSocial, '#2dd4bf', t('socialShort') + ' ' + share(sv.total), false);
  bracket(xEffSocial, xEffTax,   '#a855f7', t('tax') + ' ' + share(tax), !churchTax);
  if (churchTax) bracket(xEffTax, PLOT_X1, '#f59e0b', t('church') + ' ' + share(kirche), true);

  add('text', { x: SVG_W / 2, y: PLOT_Y1 + 50, 'text-anchor': 'middle',
    fill: '#8b949e', 'font-size': 9 }, t('caption'));
  add('text', { x: SVG_W / 2, y: PLOT_Y1 + 63, 'text-anchor': 'middle',
    fill: '#6b7280', 'font-size': 8.5 }, t('hint'));

  updatePanel({ zvE, tax, kirche, sv, net, zones, mAll });
}

// ═══ Interaktion ════════════════════════════════════════
const slider  = document.getElementById('incomeSlider');
const display = document.getElementById('incomeDisplay');
const track   = document.getElementById('sliderTrack');

const THUMB = 20;
document.querySelector('.slider-section').style.height = SVG_H + 'px';
track.style.top    = PLOT_Y0 + 'px';
track.style.height = PLOT_H + 'px';
slider.style.width = (PLOT_H + THUMB) + 'px';
display.style.top  = (PLOT_Y1 + 14) + 'px';

function setGross(v) {
  gross = Math.min(Math.max(Math.round(v), 0), axisMax);
  slider.value = gross;
  display.textContent = fmtY(gross);
  render();
}

slider.addEventListener('input', () => setGross(parseInt(slider.value, 10)));

let dragging = false;
function grossFromEvent(ev) {
  const r = chart.getBoundingClientRect();
  const y = (ev.clientY - r.top) * (SVG_H / r.height);
  const v = (PLOT_Y1 - y) / PLOT_H * axisMax;
  return Math.round(Math.min(Math.max(v, 0), axisMax) / 100) * 100;
}
chart.addEventListener('pointerdown', e => {
  dragging = true;
  chart.setPointerCapture(e.pointerId);
  setGross(grossFromEvent(e));
});
chart.addEventListener('pointermove', e => { if (dragging) setGross(grossFromEvent(e)); });
chart.addEventListener('pointerup',     () => { dragging = false; });
chart.addEventListener('pointercancel', () => { dragging = false; });

// Die Achsenbereiche unterscheiden sich je Ansicht — Leistungen laufen weit
// unterhalb der Einkommen aus, für die der Steuertarif interessant wird.
const AXIS_PRESETS = { tax: [120000, 200000, 300000], benefits: [30000, 60000, 120000] };

function buildPresets() {
  const host = document.getElementById('presets');
  host.innerHTML = AXIS_PRESETS[view]
    .map(v => `<button data-max="${v}"${v === axisMax ? ' class="active"' : ''}>${fmtKY(v)}</button>`)
    .join(' ');
}

document.getElementById('presets').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  axisMax = parseInt(btn.dataset.max, 10);
  slider.max = axisMax;
  document.querySelectorAll('#presets button')
    .forEach(b => b.classList.toggle('active', b === btn));
  setGross(gross);
});

document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn || btn.dataset.view === view) return;
  view = btn.dataset.view;
  axisMax = AXIS_PRESETS[view][view === 'tax' ? 0 : 1];
  slider.max = axisMax;
  buildPresets();
  applyLang();
});

const bind = (id, fn) => document.getElementById(id).addEventListener('change', e => {
  fn(e.target);
  applyLang();
});
const clamped = (el, lo, hi, fallback) => {
  const v = parseFloat(el.value);
  const r = Number.isFinite(v) ? Math.min(Math.max(v, lo), hi) : fallback;
  el.value = r;
  return r;
};
bind('stkl',   el => stkl = parseInt(el.value, 10));
bind('region', el => region = el.value);
bind('church', el => churchTax = parseFloat(el.value));
bind('adults', el => adults = parseInt(el.value, 10));
bind('kids',   el => kids = parseInt(el.value, 10));
bind('stufe',  el => stufe = parseInt(el.value, 10));
bind('kvz',    el => kvz = clamped(el, 0, 5, 1.7));
bind('rent',   el => rent = clamped(el, 0, 3000, 750));

document.getElementById('periods').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn || btn.dataset.period === period) return;
  period = btn.dataset.period;
  localStorage.setItem('taxPeriod', period);
  applyLang();
});

document.getElementById('langs').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  lang = btn.dataset.lang;
  localStorage.setItem('taxLang', lang);
  applyLang();
});

function applyLang() {
  const benefits = view === 'benefits';
  document.documentElement.lang = lang;
  document.title = t('docTitle');
  document.getElementById('pageTitle').textContent = t('title');
  document.getElementById('subtitle').textContent =
    benefits ? t('subtitleBenefits') : STRINGS[lang].subtitle(ROMAN[stkl]);

  document.getElementById('tabTax').textContent = t('tabTax');
  document.getElementById('tabBenefits').textContent = t('tabBenefits');
  document.querySelectorAll('#tabs button')
    .forEach(b => b.classList.toggle('active', b.dataset.view === view));
  document.getElementById('controlsTax').classList.toggle('hidden', benefits);
  document.getElementById('controlsBenefits').classList.toggle('hidden', !benefits);

  for (const [id, key] of [['axisLabel', 'axis'], ['stklLabel', 'stklLabel'],
    ['regionLabel', 'regionLabel'], ['churchLabel', 'churchLabel'], ['kvzLabel', 'kvzLabel'],
    ['adultsLabel', 'adultsLabel'], ['kidsLabel', 'kidsLabel'],
    ['rentLabel', 'rentLabel'], ['stufeLabel', 'stufeLabel'],
    ['sliderLabel', 'gross']]) {
    document.getElementById(id).textContent = t(key);
  }

  const glyph = benefits
    ? '<svg width="26" height="14" viewBox="0 0 26 14">'
      + '<line x1="2" y1="7" x2="24" y2="7" stroke="#34d399" stroke-width="4"/>'
      + '<line x1="10" y1="7" x2="24" y2="7" stroke="#fbbf24" stroke-width="4"/>'
      + '<line x1="16" y1="7" x2="24" y2="7" stroke="#ebebeb" stroke-width="4"/>'
      + '<circle cx="10" cy="7" r="2.6" fill="#161b22" stroke="#e6edf3" stroke-width="1.2"/>'
      + '<circle cx="16" cy="7" r="2.6" fill="#161b22" stroke="#e6edf3" stroke-width="1.2"/></svg>'
    : '<svg width="26" height="14" viewBox="0 0 26 14">'
      + '<path d="M2 1 h9 v12 H2 z" fill="#ebebeb"/>'
      + '<path d="M11 1 h6 v12 h-9 z" fill="#2dd4bf"/>'
      + '<path d="M17 1 h7 v12 h-7 z" fill="#a855f7"/></svg>';
  document.getElementById('hintGlyph').innerHTML = glyph;
  document.getElementById('hintText').innerHTML = t(benefits ? 'hintBenefits' : 'hintTax');

  document.getElementById('footer').innerHTML =
    `<a href="${REPO_URL}" target="_blank" rel="noopener">${t('sourceCode')}</a>`
    + ` · <a href="${LICENSE_URL}" target="_blank" rel="noopener">CC0 1.0</a><br>${t('footer')}`;

  document.getElementById('btnMonth').textContent = t('month');
  document.getElementById('btnYear').textContent  = t('year');
  document.getElementById('rentUnit').textContent = t('rentUnit');
  document.querySelectorAll('#periods button')
    .forEach(b => b.classList.toggle('active', b.dataset.period === period));

  for (const opt of document.getElementById('region').options) opt.textContent = t(opt.value);
  document.querySelector('#church option[value="0"]').textContent = t('noChurch');

  document.querySelectorAll('#langs button')
    .forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  buildPresets();      // Beschriftung hängt an Sprache und Zeitraum
  setGross(gross);
}

buildPresets();
applyLang();
</script>
</body>
</html>
