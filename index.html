<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deutsches Steuersystem 2024</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --purple: #a855f7;
  --teal: #2dd4bf;
  --amber: #f59e0b;
  --net: #ebebeb;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  gap: 14px;
}

header { text-align: center; }

header h1 {
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

header p {
  font-size: 0.75rem;
  color: var(--muted);
  margin-top: 4px;
}

.controls {
  display: flex;
  align-items: center;
  gap: 8px 16px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 900px;
  font-size: 0.68rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.controls .group { display: flex; align-items: center; gap: 6px; }

.controls button,
.controls select,
.controls input[type=number] {
  font-family: inherit;
  font-size: 0.72rem;
  letter-spacing: 0;
  text-transform: none;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px 8px;
  cursor: pointer;
}

.controls button { color: var(--muted); padding: 3px 9px; }
.controls button:hover { color: var(--text); }

.controls button.active {
  color: var(--purple);
  border-color: var(--purple);
  background: rgba(168,85,247,0.10);
}

.controls input[type=number] { width: 58px; cursor: text; }

#langs button { text-transform: uppercase; letter-spacing: 0.06em; }

.toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  user-select: none;
  letter-spacing: 0;
  text-transform: none;
  font-size: 0.72rem;
}

.toggle input { accent-color: var(--teal); width: 13px; height: 13px; cursor: pointer; }

.main {
  display: flex;
  gap: 22px;
  align-items: flex-start;
}

/* ── Slider — absolut positioniert, exakt auf die Plot-Fläche ausgerichtet ── */
.slider-section {
  position: relative;
  width: 96px;
  flex-shrink: 0;
}

.slider-label {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.7rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  white-space: nowrap;
}

.slider-track {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 36px;
}

#incomeSlider {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) rotate(-90deg);
  transform-origin: 50% 50%;
  cursor: ns-resize;
  accent-color: var(--purple);
  -webkit-appearance: none;
  appearance: none;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  outline: none;
}

#incomeSlider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--purple);
  cursor: ns-resize;
  box-shadow: 0 0 0 4px rgba(168,85,247,0.2);
  transition: box-shadow 0.15s;
}
#incomeSlider::-webkit-slider-thumb:hover { box-shadow: 0 0 0 6px rgba(168,85,247,0.35); }

#incomeSlider::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border: none;
  border-radius: 50%;
  background: var(--purple);
  cursor: ns-resize;
}

.income-display {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  font-size: 1rem;
  font-weight: 700;
  color: var(--purple);
  letter-spacing: -0.02em;
  white-space: nowrap;
}

#chart {
  display: block;
  flex-shrink: 0;
  cursor: ns-resize;
  touch-action: none;
  user-select: none;
}

/* ── Info panel ── */
.info-panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 250px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
}

.card-title {
  font-size: 0.65rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.09em;
  margin-bottom: 10px;
}

.info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 3px 0;
  font-size: 0.82rem;
}

.dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 2px;
  margin-right: 7px;
  vertical-align: middle;
  flex-shrink: 0;
}

.row-label {
  display: flex;
  align-items: center;
  color: var(--muted);
  font-size: 0.78rem;
}

.row-label .rate { opacity: 0.6; margin-left: 4px; }

.row-value { font-weight: 600; font-size: 0.82rem; white-space: nowrap; }

.divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: 8px 0;
}

.highlight-row {
  background: rgba(168,85,247,0.07);
  border-radius: 6px;
  padding: 6px 8px;
  margin-top: 2px;
}

.bracket-item {
  border-bottom: 1px solid var(--border);
  padding: 7px 0;
}
.bracket-item:last-child { border-bottom: none; }

.bracket-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 2px;
}

.bracket-name { font-size: 0.75rem; display: flex; align-items: center; }

.rate-badge {
  background: rgba(168,85,247,0.15);
  color: var(--purple);
  border-radius: 4px;
  font-size: 0.68rem;
  font-weight: 700;
  padding: 1px 5px;
  white-space: nowrap;
}

.bracket-amount { font-size: 0.78rem; font-weight: 600; text-align: right; }
.bracket-sub    { font-size: 0.68rem; color: var(--muted); }

.footnote {
  font-size: 0.66rem;
  color: var(--muted);
  line-height: 1.45;
  margin-top: 8px;
}
</style>
</head>
<body>

<header>
  <h1 id="pageTitle"></h1>
  <p id="subtitle"></p>
</header>

<div class="controls">
  <div class="group" id="presets">
    <span id="axisLabel"></span>
    <button data-max="120000" class="active">120k</button>
    <button data-max="200000">200k</button>
    <button data-max="300000">300k</button>
  </div>
  <div class="group">
    <span id="stklLabel"></span>
    <select id="stkl">
      <option value="1">I</option>
      <option value="2">II</option>
      <option value="3">III</option>
      <option value="4">IV</option>
      <option value="5">V</option>
      <option value="6">VI</option>
    </select>
  </div>
  <div class="group">
    <span id="regionLabel"></span>
    <select id="region">
      <option value="west"></option>
      <option value="ost"></option>
      <option value="sachsen"></option>
    </select>
  </div>
  <div class="group">
    <span id="churchLabel"></span>
    <select id="church">
      <option value="0"></option>
      <option value="0.08">8 %</option>
      <option value="0.09">9 %</option>
    </select>
  </div>
  <div class="group">
    <span id="kvzLabel"></span>
    <input type="number" id="kvz" value="1.7" min="0" max="5" step="0.1"> %
  </div>
  <label class="toggle">
    <input type="checkbox" id="childless" checked>
    <span id="childlessLabel"></span>
  </label>
  <div class="group" id="langs">
    <button data-lang="de">de</button>
    <button data-lang="en">en</button>
  </div>
</div>

<div class="main">

  <div class="slider-section">
    <div class="slider-label" id="sliderLabel"></div>
    <div class="slider-track" id="sliderTrack">
      <input type="range" id="incomeSlider" min="0" max="120000" value="60000" step="100">
    </div>
    <div class="income-display" id="incomeDisplay"></div>
  </div>

  <svg id="chart" width="480" height="620"></svg>

  <div class="info-panel" id="infoPanel"></div>

</div>

<script>
// ═══ Sprachen ═══════════════════════════════════════════
const STRINGS = {
  de: {
    docTitle: 'Deutsches Steuersystem 2024',
    title: 'Deutsches Steuersystem',
    subtitle: n => `Lohnsteuer + Sozialabgaben 2024 · Steuerklasse ${n} · Bruttolohn`,
    axis: 'Achse bis', stklLabel: 'Steuerklasse', regionLabel: 'Region',
    churchLabel: 'Kirchensteuer', kvzLabel: 'KV-Zusatzbeitrag', childless: 'kinderlos',
    west: 'West', ost: 'Ost', sachsen: 'Sachsen', noChurch: 'keine',
    gross: 'Bruttolohn', net: 'Netto', tax: 'Steuer', church: 'Kirche',
    social: 'Sozialabgaben', socialShort: 'SV',
    marginal: 'Grenzbelastung',
    capKV: 'BBG KV/PV', capRV: 'BBG RV/AV',
    caption: 'Breite = Belastung des nächsten Euro · Fläche = tatsächlicher Betrag',
    hint: 'Slider hoch/runter ziehen — auch direkt im Diagramm',
    summary: 'Zusammenfassung', churchTax: 'Kirchensteuer',
    taxable: 'zu versteuern', burdenRate: 'Abgabenquote',
    socialCard: 'Sozialabgaben · AN-Anteil',
    pension: 'Rente', health: 'Kranken', care: 'Pflege', unemployment: 'Arbeitslos',
    footnote: (kv, rv) => `BBG 2024: ${kv} € (KV/PV) bzw. ${rv} € (RV/AV) — darüber steigen die `
      + 'Beiträge nicht mehr. RV, KV und PV mindern über die Vorsorgepauschale die Steuer.',
    byZone: 'Steuer nach Zonen', zvEShort: 'zvE',
    belowGFB: 'Unterhalb Grundfreibetrag',
    noZones: 'In den Steuerklassen V und VI gilt eine eigene Formel '
      + '(§39b Abs. 2 Satz 7 EStG) statt des Zonentarifs.',
    monthly: 'Monatlich',
    zones: ['Grundfreibetrag', 'Progressionszone I', 'Progressionszone II', 'Proportionalzone', 'Reichensteuer'],
  },
  en: {
    docTitle: 'German Tax System 2024',
    title: 'German Tax System',
    subtitle: n => `Wage tax + social contributions 2024 · Tax class ${n} · gross salary`,
    axis: 'Axis up to', stklLabel: 'Tax class', regionLabel: 'Region',
    churchLabel: 'Church tax', kvzLabel: 'Health surcharge', childless: 'no children',
    west: 'West', ost: 'East', sachsen: 'Saxony', noChurch: 'none',
    gross: 'Gross salary', net: 'Net', tax: 'Tax', church: 'Church',
    social: 'Social contributions', socialShort: 'Social',
    marginal: 'Marginal burden',
    capKV: 'Cap health/care', capRV: 'Cap pension/unempl.',
    caption: 'Width = burden on the next euro · Area = actual amount',
    hint: 'Drag the slider up/down — or drag inside the chart',
    summary: 'Summary', churchTax: 'Church tax',
    taxable: 'Taxable income', burdenRate: 'Total burden',
    socialCard: 'Social contributions · employee',
    pension: 'Pension', health: 'Health', care: 'Long-term care', unemployment: 'Unemployment',
    footnote: (kv, rv) => `2024 caps: €${kv} (health/care) and €${rv} (pension/unempl.) — above them `
      + 'contributions stop growing. Pension, health and care insurance reduce the tax base.',
    byZone: 'Tax by bracket', zvEShort: 'taxable',
    belowGFB: 'Below basic allowance',
    noZones: 'Tax classes V and VI use their own formula '
      + '(§39b (2) sentence 7 EStG) instead of the bracket tariff.',
    monthly: 'Monthly',
    zones: ['Basic allowance', 'Progressive zone I', 'Progressive zone II', 'Proportional zone', 'Top rate'],
  },
};

let lang = (localStorage.getItem('taxLang')
  || (navigator.language || 'de').slice(0, 2).toLowerCase()) === 'de' ? 'de' : 'en';
const t = k => STRINGS[lang][k];
const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI'];

// ═══ Einkommensteuertarif 2024 (§32a EStG) ══════════════
// Stetige Fassung (ohne die gesetzliche Abrundung), damit Fläche und
// Grenzbelastung im Diagramm exakt zusammenpassen.
const GFB    = 11604;
const Z2_END = 17005;
const Z3_END = 66760;
const Z4_END = 277825;

// Die Konstanten der oberen Zonen sind im Gesetz auf zwei Nachkommastellen
// gerundet (1025,38 / −10602,13 / −18936,88), wodurch der Tarif an den
// Zonengrenzen um wenige Cent springt. Bei der gesetzlichen Abrundung auf volle
// Euro fällt das nicht auf, eine numerische Ableitung macht daraus aber einen
// Ausschlag von mehreren Prozentpunkten. Daher hier aus der Stetigkeitsbedingung
// hergeleitet — die Steuer weicht dadurch um höchstens 5 Cent ab.
const zone2 = zvE => { const y = (zvE - GFB) / 10000; return (922.98 * y + 1400) * y; };
const C2 = zone2(Z2_END);                                    // ≈ 1025,3807
const zone3 = zvE => { const z = (zvE - Z2_END) / 10000; return (181.19 * z + 2397) * z + C2; };
const C3 = zone3(Z3_END) - 0.42 * Z3_END;                    // ≈ −10602,08
const C4 = (0.42 * Z4_END + C3) - 0.45 * Z4_END;             // ≈ −18936,83

function tarif(zvE) {
  if (zvE <= GFB)    return 0;
  if (zvE <= Z2_END) return zone2(zvE);
  if (zvE <= Z3_END) return zone3(zvE);
  if (zvE <= Z4_END) return 0.42 * zvE + C3;
  return 0.45 * zvE + C4;
}

const ZONES = [
  { i: 0, rateLabel: '0 %',     min: 0,      max: GFB,      color: null      },
  { i: 1, rateLabel: '14–24 %', min: GFB,    max: Z2_END,   color: '#f0abfc' },
  { i: 2, rateLabel: '24–42 %', min: Z2_END, max: Z3_END,   color: '#c084fc' },
  { i: 3, rateLabel: '42 %',    min: Z3_END, max: Z4_END,   color: '#7c3aed' },
  { i: 4, rateLabel: '45 %',    min: Z4_END, max: Infinity, color: '#4c1d95' },
];
const FLAT_TAX_COLOR = '#a855f7';   // Steuerklassen V/VI: kein Zonentarif

// ═══ Parameter 2024 (Programmablaufplan des BMF) ════════
const BBG_KVPV   = 62100;
const BBG_RV_W   = 90600;
const BBG_RV_O   = 89400;
const R_RV       = 0.093;    // AN-Anteil Rentenversicherung
const R_AV       = 0.013;    // AN-Anteil Arbeitslosenversicherung
const KV_ALLG    = 0.073;    // AN-Anteil KV, allgemeiner Beitragssatz
const KV_ERM     = 0.070;    // ermäßigter Satz — maßgeblich für die Vorsorgepauschale
const PV_NORMAL  = 0.017;
const PV_SACHSEN = 0.022;
const PV_ZUSCHLAG = 0.006;   // Kinderlose, trägt der AN allein
const ANP = 1230, SAP = 36, EFA = 4260;
// Grenzwerte der Steuerklassen V/VI (§39b Abs. 2 Satz 7 EStG)
const W1 = 13279, W2 = 33380, W3 = 222260;

// ═══ Einstellungen ══════════════════════════════════════
let stkl      = 1;
let region    = 'west';
let churchTax = 0;
let kvz       = 1.7;
let childless = true;

const bbgRV   = () => region === 'west' ? BBG_RV_W : BBG_RV_O;
const kvPaid  = () => KV_ALLG + kvz / 200;         // tatsächlich gezahlt
const kvDed   = () => KV_ERM  + kvz / 200;         // steuerlich abziehbar
const pvBase  = () => region === 'sachsen' ? PV_SACHSEN : PV_NORMAL;
const pvPaid  = () => pvBase() + (childless ? PV_ZUSCHLAG : 0);

// ── Sozialabgaben (Arbeitnehmeranteil) ──
function socialParts(gross) {
  const bRV = Math.min(gross, bbgRV());
  const bKV = Math.min(gross, BBG_KVPV);
  const rv = R_RV * bRV, av = R_AV * bRV;
  const kv = kvPaid() * bKV, pv = pvPaid() * bKV;
  return { rv, av, kv, pv, total: rv + av + kv + pv };
}
const socialOf = g => socialParts(g).total;

// ── Vorsorgepauschale (§39b Abs. 2 Satz 5 Nr. 3 EStG) ──
// Teilbetrag RV plus Teilbetrag KV/PV, letzterer mindestens die
// Mindestvorsorgepauschale von 12 % des Arbeitslohns (Höchstbetrag 1.900 €,
// in Steuerklasse III 3.000 €).
function vorsorgepauschale(gross) {
  const vsp1 = R_RV * Math.min(gross, bbgRV());
  const vhb  = stkl === 3 ? 3000 : 1900;
  const mind = Math.min(0.12 * gross, vhb);
  const kvpv = (kvDed() + pvBase()) * Math.min(gross, BBG_KVPV);
  return vsp1 + Math.max(kvpv, mind);
}

function zvEOf(gross) {
  const anp = stkl === 6 ? 0 : ANP;
  const sap = stkl === 6 ? 0 : SAP;
  const efa = stkl === 2 ? EFA : 0;
  return Math.max(0, gross - (anp + sap + efa) - vorsorgepauschale(gross));
}

// ── Lohnsteuer der Steuerklassen V und VI ──
function up56(zx) {
  const diff = 2 * (tarif(zx * 1.25) - tarif(zx * 0.75));
  return Math.max(diff, zx * 0.14);          // Mindeststeuer
}

function mst56(zvE) {
  if (zvE > W2) {
    let st = up56(W2);
    st += zvE > W3 ? (W3 - W2) * 0.42 + (zvE - W3) * 0.45
                   : (zvE - W2) * 0.42;
    return st;
  }
  const vergl = up56(zvE);
  if (zvE <= W1) return vergl;
  return Math.min(up56(W1) + (zvE - W1) * 0.42, vergl);   // Höchststeuer
}

const KZTAB = () => stkl === 3 ? 2 : 1;

function lohnsteuer(zvE) {
  if (stkl >= 5) return mst56(zvE);
  const k = KZTAB();
  return tarif(zvE / k) * k;                  // Splitting in Steuerklasse III
}

const taxOf    = g => lohnsteuer(zvEOf(g));
const churchOf = g => churchTax * taxOf(g);

// ── Grenzbelastungen: numerische Ableitung der stetigen Funktionen ──
function slope(f, v) {
  const h = 0.5;
  return v < h ? (f(h) - f(0)) / h : (f(v + h) - f(v - h)) / (2 * h);
}
const mSocial = v => slope(socialOf, v);
const mTax    = v => slope(taxOf, v);
const mChurch = v => slope(churchOf, v);

// Brutto, bei dem ein bestimmtes zvE erreicht wird (zvEOf ist monoton)
function grossAtZvE(target) {
  let lo = 0, hi = 2e6;
  for (let i = 0; i < 60; i++) {
    const mid = (lo + hi) / 2;
    if (zvEOf(mid) < target) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

function breakdown(zvE) {
  const k = KZTAB();
  return ZONES.map(z => {
    const min = z.min * k, max = z.max * k;
    if (zvE <= min) return null;
    const incomeInZone = Math.min(zvE, max) - min;
    const taxFromZone  = lohnsteuer(Math.min(zvE, max)) - lohnsteuer(min);
    return { ...z, incomeInZone, taxFromZone };
  }).filter(Boolean);
}

// ═══ Geometrie ══════════════════════════════════════════
const SVG_W = 480, SVG_H = 620;
const PAD_L = 52, PAD_R = 64, PAD_T = 22, PAD_B = 78;
const PLOT_X0 = PAD_L, PLOT_X1 = SVG_W - PAD_R, PLOT_W = PLOT_X1 - PLOT_X0;
const PLOT_Y0 = PAD_T, PLOT_Y1 = SVG_H - PAD_B, PLOT_H = PLOT_Y1 - PLOT_Y0;

let axisMax = 120000;
let gross   = 60000;

const yOf = v => PLOT_Y1 - (v / axisMax) * PLOT_H;
const xOf = f => PLOT_X0 + Math.max(0, Math.min(1, f)) * PLOT_W;

// Grenzlinien: Netto | Sozialabgaben | Steuer | Kirchensteuer
const xA = v => xOf(1 - mSocial(v) - mTax(v) - mChurch(v));
const xB = v => xOf(1 - mTax(v) - mChurch(v));
const xC = v => xOf(1 - mChurch(v));
const edgeL = () => PLOT_X0;
const edgeR = () => PLOT_X1;

const svgNS = 'http://www.w3.org/2000/svg';
const chart = document.getElementById('chart');

function el(tag, attrs = {}, text = null) {
  const e = document.createElementNS(svgNS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== null) e.textContent = text;
  return e;
}
const add = (tag, attrs, text) => { const e = el(tag, attrs, text); chart.appendChild(e); return e; };

const loc    = () => lang === 'de' ? 'de-DE' : 'en-GB';
const num    = n => Math.round(n).toLocaleString(loc());
const fmt    = n => num(n) + ' €';
const fmtPct = r => {
  const s = (r * 100).toFixed(1);
  return (lang === 'de' ? s.replace('.', ',') : s) + ' %';
};
const fmtRate = r => {
  const s = (r * 100).toFixed(2).replace(/0$/, '').replace(/\.$/, '');
  return (lang === 'de' ? s.replace('.', ',') : s) + ' %';
};
const fmtK = v => {
  if (v < 1000) return String(Math.round(v));
  const s = (v / 1000).toFixed(1).replace('.0', '');
  return (lang === 'de' ? s.replace('.', ',') : s) + 'k';
};

// Alle Knick- und Sprungstellen in Brutto-Koordinaten
function breakpoints() {
  const k = KZTAB();
  const zvEEdges = stkl >= 5
    ? [W1, W2, W3, GFB / 1.25, GFB / 0.75, Z2_END / 1.25, Z2_END / 0.75, Z3_END / 1.25]
    : [GFB * k, Z2_END * k, Z3_END * k, Z4_END * k];
  // Der Abstand muss größer sein als das Fenster von slope(), sonst wird an
  // jedem Knick ein gemittelter Zwischenwert gezeichnet statt der scharfen Kante.
  const eps = 0.6;
  const bp = [];
  for (const e of zvEEdges) {
    const g = grossAtZvE(e);
    bp.push(g - eps, g + eps);
  }
  const vhb = stkl === 3 ? 3000 : 1900;
  bp.push(BBG_KVPV - eps, BBG_KVPV + eps, bbgRV() - eps, bbgRV() + eps);
  bp.push(vhb / 0.12, vhb / (kvDed() + pvBase()));    // Mindestvorsorgepauschale
  return bp;
}

function samples(v0, v1) {
  const set = new Set([v0, v1]);
  const step = Math.max((v1 - v0) / 400, 1);
  for (let v = v0; v < v1; v += step) set.add(v);
  for (const b of breakpoints()) if (b > v0 && b < v1) set.add(b);
  return [...set].sort((a, b) => a - b);
}

function bandPath(v0, v1, fLeft, fRight) {
  const vs = samples(v0, v1);
  let d = '';
  vs.forEach((v, i) => { d += (i ? 'L' : 'M') + fLeft(v).toFixed(2) + ' ' + yOf(v).toFixed(2); });
  for (let i = vs.length - 1; i >= 0; i--) {
    d += 'L' + fRight(vs[i]).toFixed(2) + ' ' + yOf(vs[i]).toFixed(2);
  }
  return d + 'Z';
}

function linePath(f, v0, v1) {
  let d = '';
  samples(v0, v1).forEach((v, i) => { d += (i ? 'L' : 'M') + f(v).toFixed(2) + ' ' + yOf(v).toFixed(2); });
  return d;
}

function drawBands(zonesInGross, v0, v1, fLeft, fRight, opacity) {
  for (const z of zonesInGross) {
    if (!z.color) continue;
    const lo = Math.max(z.lo, v0), hi = Math.min(z.hi, v1, axisMax);
    if (hi - lo < 0.5) continue;
    add('path', {
      d: bandPath(lo + 0.001, hi, fLeft, fRight),
      fill: z.color, opacity,
      stroke: z.color, 'stroke-width': 0.6, 'stroke-opacity': opacity
    });
  }
}

// Steuerzonen in Brutto-Koordinaten; in V/VI gibt es keinen Zonentarif
function taxZonesGross() {
  if (stkl >= 5) return [{ color: FLAT_TAX_COLOR, lo: 0, hi: Infinity, rateLabel: null }];
  const k = KZTAB();
  return ZONES.map(z => ({
    ...z,
    lo: grossAtZvE(z.min * k),
    hi: z.max === Infinity ? Infinity : grossAtZvE(z.max * k),
  }));
}
const svZonesGross = () => [
  { color: '#2dd4bf', lo: 0,        hi: BBG_KVPV },
  { color: '#0d9488', lo: BBG_KVPV, hi: bbgRV()  },
];

// ═══ Rendering ══════════════════════════════════════════
function render() {
  chart.innerHTML = '';

  const zvE    = zvEOf(gross);
  const tax    = taxOf(gross);
  const kirche = churchOf(gross);
  const sv     = socialParts(gross);
  const net    = gross - tax - kirche - sv.total;
  const zones  = stkl >= 5 ? [] : breakdown(zvE);
  const mAll   = mSocial(gross) + mTax(gross) + mChurch(gross);
  const lineY  = yOf(gross);
  const taxZ   = taxZonesGross();

  add('rect', { x: 0, y: 0, width: SVG_W, height: SVG_H, fill: '#161b22', rx: 12 });

  // ── Ausblick oberhalb des Sliders ──
  if (gross < axisMax) {
    add('path', { d: bandPath(gross, axisMax, edgeL, xA), fill: '#ebebeb', opacity: 0.035 });
    drawBands(svZonesGross(), gross, axisMax, xA, xB, 0.13);
    drawBands(taxZ,           gross, axisMax, xB, xC, 0.13);
    if (churchTax) add('path', { d: bandPath(gross, axisMax, xC, edgeR), fill: '#f59e0b', opacity: 0.13 });
  }

  // ── bezahlter Bereich ──
  if (gross > 0) {
    add('path', { d: bandPath(0, gross, edgeL, xA), fill: '#ebebeb' });
    drawBands(svZonesGross(), 0, gross, xA, xB, 1);
    drawBands(taxZ,           0, gross, xB, xC, 1);
    if (churchTax) add('path', { d: bandPath(0, gross, xC, edgeR), fill: '#f59e0b' });
  }

  // ── Grenzlinien ──
  if (churchTax) {
    add('path', { d: linePath(xC, 0, axisMax), fill: 'none',
      stroke: '#e6edf3', 'stroke-width': 1, 'stroke-linejoin': 'round', opacity: 0.4 });
  }
  add('path', { d: linePath(xB, 0, axisMax), fill: 'none',
    stroke: '#e6edf3', 'stroke-width': 1.1, 'stroke-linejoin': 'round', opacity: 0.5 });
  add('path', { d: linePath(xA, 0, axisMax), fill: 'none',
    stroke: '#e6edf3', 'stroke-width': 1.6, 'stroke-linejoin': 'round', opacity: 0.85 });

  // ── Y-Achse ──
  add('line', { x1: PLOT_X0, y1: PLOT_Y0, x2: PLOT_X0, y2: PLOT_Y1, stroke: '#30363d' });

  const k = KZTAB();
  const ticks = [0, ...(stkl >= 5 ? [W1, W2] : [GFB, Z2_END, Z3_END, Z4_END].map(z => z * k))
    .map(grossAtZvE), axisMax].filter(v => v <= axisMax).sort((a, b) => a - b);
  let lastLabelY = Infinity;
  for (const tv of ticks) {
    const y = yOf(tv);
    if (tv > 0 && tv < axisMax) {
      add('line', { x1: PLOT_X0, y1: y, x2: PLOT_X1, y2: y,
        stroke: '#30363d', 'stroke-width': 0.8, 'stroke-dasharray': '3,3', opacity: 0.55 });
    }
    if (lastLabelY - y < 11) continue;
    lastLabelY = y;
    add('text', { x: PLOT_X0 - 6, y, 'text-anchor': 'end', 'dominant-baseline': 'middle',
      fill: '#8b949e', 'font-size': 8.5 }, tv === 0 ? '0' : fmtK(tv));
  }

  // ── Beitragsbemessungsgrenzen ──
  for (const [v, name] of [[BBG_KVPV, t('capKV')], [bbgRV(), t('capRV')]]) {
    if (v > axisMax) continue;
    const y = yOf(v);
    add('line', { x1: PLOT_X0, y1: y, x2: PLOT_X1, y2: y,
      stroke: '#2dd4bf', 'stroke-width': 0.9, 'stroke-dasharray': '2,3', opacity: 0.75 });
    add('text', { x: PLOT_X0 + 5, y: y - 4, fill: '#2dd4bf', 'font-size': 8, opacity: 0.9 },
      name + ' ' + fmtK(v));
  }

  // ── Steuerzonen im rechten Rand ──
  let lastZoneY = -Infinity;
  for (const z of [...taxZ].reverse()) {
    if (!z.rateLabel) continue;
    const lo = Math.max(z.lo, 0), hi = Math.min(z.hi, axisMax);
    if (hi - lo < 1) continue;
    const yMid = yOf((lo + hi) / 2);
    add('line', { x1: PLOT_X1, y1: yOf(hi), x2: PLOT_X1 + 5, y2: yOf(hi),
      stroke: '#30363d', 'stroke-width': 0.8 });
    if (yMid - lastZoneY < 12) continue;
    lastZoneY = yMid;
    add('text', { x: PLOT_X1 + 8, y: yMid, 'dominant-baseline': 'middle',
      fill: z.color ?? '#6b7280', 'font-size': 9, 'font-weight': z.color ? 700 : 400,
      opacity: gross > z.lo ? 1 : 0.45 }, z.rateLabel);
  }

  // ── Flächenbeschriftung ──
  const outlined = (x, y, text, size, weight, opacity) => add('text', {
    x, y, 'text-anchor': 'middle', fill: '#fff',
    stroke: 'rgba(0,0,0,0.4)', 'stroke-width': size > 11 ? 2.6 : 2.4,
    'paint-order': 'stroke', 'font-size': size, 'font-weight': weight, opacity
  }, text);

  if (gross > 0 && PLOT_Y1 - lineY > 46) {
    const vN = gross * 0.55;
    if (xA(vN) - PLOT_X0 > 54) {
      add('text', { x: (PLOT_X0 + xA(vN)) / 2, y: yOf(vN) - 5, 'text-anchor': 'middle',
        fill: '#1a1a2e', 'font-size': 13, 'font-weight': 700 }, t('net'));
      add('text', { x: (PLOT_X0 + xA(vN)) / 2, y: yOf(vN) + 10, 'text-anchor': 'middle',
        fill: '#4a4a5e', 'font-size': 9.5 }, fmt(net));
    }

    const vT = gross * 0.5;
    if (xC(vT) - xB(vT) > 66) {
      outlined((xB(vT) + xC(vT)) / 2, yOf(vT) - 5, t('tax'), 13, 700, 1);
      outlined((xB(vT) + xC(vT)) / 2, yOf(vT) + 10, fmt(tax), 9.5, 400, 0.92);
    }

    const vS = Math.min(gross, BBG_KVPV) * 0.5;
    if (vS < gross && xB(vS) - xA(vS) > 74) {
      outlined((xA(vS) + xB(vS)) / 2, yOf(vS) - 4, t('social'), 10.5, 700, 1);
      outlined((xA(vS) + xB(vS)) / 2, yOf(vS) + 9, fmt(sv.total), 9, 400, 0.92);
    }
  }

  // ── Effektive Aufteilung: flächengleiche Senkrechte ──
  const cut = amount => xOf(gross > 0 ? 1 - amount / gross : 1);
  const xEffNet    = cut(tax + kirche + sv.total);
  const xEffSocial = cut(tax + kirche);
  const xEffTax    = cut(kirche);
  if (gross > 0) {
    const lines = churchTax ? [xEffNet, xEffSocial, xEffTax] : [xEffNet, xEffSocial];
    for (const x of lines) {
      add('line', { x1: x, y1: lineY, x2: x, y2: PLOT_Y1,
        stroke: '#0d1117', 'stroke-width': 1, 'stroke-dasharray': '4,3', opacity: 0.5 });
    }
  }

  // ── Slider ──
  add('line', { x1: PLOT_X0 - 8, y1: lineY, x2: PLOT_X1 + 8, y2: lineY,
    stroke: '#a855f7', 'stroke-width': 2 });
  add('circle', { cx: PLOT_X0 - 8, cy: lineY, r: 4, fill: '#a855f7' });
  add('circle', { cx: PLOT_X1 + 8, cy: lineY, r: 4, fill: '#a855f7' });

  const xCut = xA(gross);
  add('circle', { cx: xCut, cy: lineY, r: 4.5, fill: '#0d1117', stroke: '#a855f7', 'stroke-width': 2 });
  const labelLeft = xCut > PLOT_X0 + PLOT_W * 0.6;
  add('text', {
    x: xCut + (labelLeft ? -10 : 10), y: lineY - 9,
    'text-anchor': labelLeft ? 'end' : 'start',
    fill: '#a855f7', 'font-size': 10, 'font-weight': 700,
    stroke: '#161b22', 'stroke-width': 2.6, 'paint-order': 'stroke'
  }, t('marginal') + ' ' + fmtPct(mAll));

  // ── X-Achse mit effektiver Aufteilung ──
  add('line', { x1: PLOT_X0, y1: PLOT_Y1, x2: PLOT_X1, y2: PLOT_Y1, stroke: '#30363d' });

  const by = PLOT_Y1 + 16;
  const bracket = (x0, x1, color, label, allowOutside) => {
    if (x1 - x0 < 1) return;
    add('line', { x1: x0, y1: by, x2: x1, y2: by, stroke: color, 'stroke-width': 2 });
    add('line', { x1: x0, y1: by - 3, x2: x0, y2: by + 3, stroke: color, 'stroke-width': 2 });
    add('line', { x1: x1, y1: by - 3, x2: x1, y2: by + 3, stroke: color, 'stroke-width': 2 });
    const wide = x1 - x0 > 46;
    if (!wide && !allowOutside) return;
    add('text', { x: wide ? (x0 + x1) / 2 : SVG_W - 6, y: by + 15,
      'text-anchor': wide ? 'middle' : 'end',
      fill: color, 'font-size': 9.5, 'font-weight': 600 }, label);
  };
  const share = v => gross > 0 ? fmtPct(v / gross) : '–';
  bracket(PLOT_X0,   xEffNet,    '#ebebeb', t('net') + ' ' + share(net), false);
  bracket(xEffNet,   xEffSocial, '#2dd4bf', t('socialShort') + ' ' + share(sv.total), false);
  bracket(xEffSocial, xEffTax,   '#a855f7', t('tax') + ' ' + share(tax), !churchTax);
  if (churchTax) bracket(xEffTax, PLOT_X1, '#f59e0b', t('church') + ' ' + share(kirche), true);

  add('text', { x: SVG_W / 2, y: PLOT_Y1 + 50, 'text-anchor': 'middle',
    fill: '#8b949e', 'font-size': 9 }, t('caption'));
  add('text', { x: SVG_W / 2, y: PLOT_Y1 + 63, 'text-anchor': 'middle',
    fill: '#6b7280', 'font-size': 8.5 }, t('hint'));

  updatePanel({ zvE, tax, kirche, sv, net, zones, mAll });
}

// ═══ Info panel ═════════════════════════════════════════
function updatePanel({ zvE, tax, kirche, sv, net, zones, mAll }) {
  const panel = document.getElementById('infoPanel');
  const taxZones = zones.filter(z => z.color && z.taxFromZone > 0);
  const pct = v => gross > 0 ? fmtPct(v / gross) : '–';
  const svRow = (key, rate, value) => `
      <div class="info-row">
        <span class="row-label">${t(key)}<span class="rate">${rate}</span></span>
        <span class="row-value">${fmt(value)}</span>
      </div>`;

  panel.innerHTML = `
    <div class="card">
      <div class="card-title">${t('summary')}</div>
      <div class="info-row">
        <span class="row-label"><span class="dot" style="background:#ebebeb;border:1px solid #ccc"></span>${t('net')}</span>
        <span class="row-value">${fmt(net)}</span>
      </div>
      <div class="info-row">
        <span class="row-label"><span class="dot" style="background:#2dd4bf"></span>${t('social')}</span>
        <span class="row-value">${fmt(sv.total)}</span>
      </div>
      <div class="info-row">
        <span class="row-label"><span class="dot" style="background:#a855f7"></span>${t('tax')}</span>
        <span class="row-value">${fmt(tax)}</span>
      </div>
      ${churchTax ? `
      <div class="info-row">
        <span class="row-label"><span class="dot" style="background:#f59e0b"></span>${t('churchTax')}</span>
        <span class="row-value">${fmt(kirche)}</span>
      </div>` : ''}
      <hr class="divider">
      <div class="info-row">
        <span class="row-label">${t('gross')}</span>
        <span class="row-value">${fmt(gross)}</span>
      </div>
      <div class="info-row">
        <span class="row-label">${t('taxable')}</span>
        <span class="row-value">${fmt(zvE)}</span>
      </div>
      <div class="info-row">
        <span class="row-label">${t('burdenRate')}</span>
        <span class="row-value">${pct(tax + kirche + sv.total)}</span>
      </div>
      <div class="info-row highlight-row">
        <span class="row-label">${t('marginal')}</span>
        <span class="row-value" style="color:#a855f7">${fmtPct(mAll)}</span>
      </div>
    </div>

    <div class="card">
      <div class="card-title">${t('socialCard')}</div>
      ${svRow('pension', fmtRate(R_RV), sv.rv)}
      ${svRow('health', fmtRate(kvPaid()), sv.kv)}
      ${svRow('care', fmtRate(pvPaid()), sv.pv)}
      ${svRow('unemployment', fmtRate(R_AV), sv.av)}
      <div class="footnote">${t('footnote')(num(BBG_KVPV), num(bbgRV()))}</div>
    </div>

    <div class="card">
      <div class="card-title">${t('byZone')}</div>
      ${stkl >= 5 ? `<div class="footnote" style="margin:0">${t('noZones')}</div>` : `
        ${taxZones.map(z => `
          <div class="bracket-item">
            <div class="bracket-header">
              <span class="bracket-name">
                <span class="dot" style="background:${z.color}"></span>
                <span>${STRINGS[lang].zones[z.i]}</span>
              </span>
              <span class="rate-badge">${z.rateLabel}</span>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:baseline;padding-left:16px">
              <span class="bracket-sub">${fmt(z.incomeInZone)} ${t('zvEShort')}</span>
              <span class="bracket-amount">${fmt(z.taxFromZone)}</span>
            </div>
          </div>
        `).join('')}
        ${taxZones.length === 0 ? `<div style="color:#8b949e;font-size:0.8rem">${t('belowGFB')}</div>` : ''}
      `}
    </div>

    <div class="card">
      <div class="card-title">${t('monthly')}</div>
      <div class="info-row">
        <span class="row-label">${t('gross')}</span>
        <span class="row-value">${fmt(gross / 12)}</span>
      </div>
      <div class="info-row">
        <span class="row-label"><span class="dot" style="background:#ebebeb;border:1px solid #ccc"></span>${t('net')}</span>
        <span class="row-value">${fmt(net / 12)}</span>
      </div>
      <div class="info-row">
        <span class="row-label"><span class="dot" style="background:#2dd4bf"></span>${t('social')}</span>
        <span class="row-value">${fmt(sv.total / 12)}</span>
      </div>
      <div class="info-row">
        <span class="row-label"><span class="dot" style="background:#a855f7"></span>${t('tax')}</span>
        <span class="row-value">${fmt((tax + kirche) / 12)}</span>
      </div>
    </div>
  `;
}

// ═══ Interaktion ════════════════════════════════════════
const slider  = document.getElementById('incomeSlider');
const display = document.getElementById('incomeDisplay');
const track   = document.getElementById('sliderTrack');

const THUMB = 20;
document.querySelector('.slider-section').style.height = SVG_H + 'px';
track.style.top    = PLOT_Y0 + 'px';
track.style.height = PLOT_H + 'px';
slider.style.width = (PLOT_H + THUMB) + 'px';
display.style.top  = (PLOT_Y1 + 14) + 'px';

function setGross(v) {
  gross = Math.min(Math.max(Math.round(v), 0), axisMax);
  slider.value = gross;
  display.textContent = fmt(gross);
  render();
}

slider.addEventListener('input', () => setGross(parseInt(slider.value, 10)));

let dragging = false;
function grossFromEvent(ev) {
  const r = chart.getBoundingClientRect();
  const y = (ev.clientY - r.top) * (SVG_H / r.height);
  const v = (PLOT_Y1 - y) / PLOT_H * axisMax;
  return Math.round(Math.min(Math.max(v, 0), axisMax) / 100) * 100;
}
chart.addEventListener('pointerdown', e => {
  dragging = true;
  chart.setPointerCapture(e.pointerId);
  setGross(grossFromEvent(e));
});
chart.addEventListener('pointermove', e => { if (dragging) setGross(grossFromEvent(e)); });
chart.addEventListener('pointerup',     () => { dragging = false; });
chart.addEventListener('pointercancel', () => { dragging = false; });

document.getElementById('presets').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  axisMax = parseInt(btn.dataset.max, 10);
  slider.max = axisMax;
  document.querySelectorAll('#presets button')
    .forEach(b => b.classList.toggle('active', b === btn));
  setGross(gross);
});

const bind = (id, fn) => document.getElementById(id).addEventListener('change', e => {
  fn(e.target);
  applyLang();
});
bind('stkl',      el => stkl = parseInt(el.value, 10));
bind('region',    el => region = el.value);
bind('church',    el => churchTax = parseFloat(el.value));
bind('childless', el => childless = el.checked);
bind('kvz',       el => {
  const v = parseFloat(el.value);
  kvz = Number.isFinite(v) ? Math.min(Math.max(v, 0), 5) : 1.7;
  el.value = kvz;
});

document.getElementById('langs').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  lang = btn.dataset.lang;
  localStorage.setItem('taxLang', lang);
  applyLang();
});

function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('docTitle');
  document.getElementById('pageTitle').textContent = t('title');
  document.getElementById('subtitle').textContent  = STRINGS[lang].subtitle(ROMAN[stkl]);
  document.getElementById('axisLabel').textContent = t('axis');
  document.getElementById('stklLabel').textContent = t('stklLabel');
  document.getElementById('regionLabel').textContent = t('regionLabel');
  document.getElementById('churchLabel').textContent = t('churchLabel');
  document.getElementById('kvzLabel').textContent = t('kvzLabel');
  document.getElementById('childlessLabel').textContent = t('childless');
  document.getElementById('sliderLabel').textContent = t('gross');

  const regionSel = document.getElementById('region');
  for (const opt of regionSel.options) opt.textContent = t(opt.value);
  document.querySelector('#church option[value="0"]').textContent = t('noChurch');

  document.querySelectorAll('#langs button')
    .forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  setGross(gross);
}

applyLang();
</script>
