<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deutsches Steuersystem 2024</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --purple: #a855f7;
  --teal: #2dd4bf;
  --net: #ebebeb;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  gap: 18px;
}

header { text-align: center; }

header h1 {
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

header p {
  font-size: 0.75rem;
  color: var(--muted);
  margin-top: 4px;
}

.controls {
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
  justify-content: center;
  font-size: 0.68rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.controls .group { display: flex; align-items: center; gap: 6px; }

.controls button {
  font: inherit;
  letter-spacing: 0;
  text-transform: none;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px 9px;
  cursor: pointer;
}

.controls button:hover { color: var(--text); }

.controls button.active {
  color: var(--purple);
  border-color: var(--purple);
  background: rgba(168,85,247,0.10);
}

#langs button { text-transform: uppercase; letter-spacing: 0.06em; }

.toggle {
  display: flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  user-select: none;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px 10px 3px 8px;
  letter-spacing: 0;
  text-transform: none;
  font-size: 0.72rem;
}

.toggle:hover { color: var(--text); }

.toggle input {
  accent-color: var(--teal);
  width: 13px;
  height: 13px;
  cursor: pointer;
}

.toggle.on {
  color: var(--teal);
  border-color: var(--teal);
  background: rgba(45,212,191,0.10);
}

.main {
  display: flex;
  gap: 22px;
  align-items: flex-start;
}

/* ── Slider — absolut positioniert, exakt auf die Plot-Fläche ausgerichtet ── */
.slider-section {
  position: relative;
  width: 96px;
  flex-shrink: 0;
}

.slider-label {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.7rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  white-space: nowrap;
}

.slider-track {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 36px;
}

#incomeSlider {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) rotate(-90deg);
  transform-origin: 50% 50%;
  cursor: ns-resize;
  accent-color: var(--purple);
  -webkit-appearance: none;
  appearance: none;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  outline: none;
}

#incomeSlider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--purple);
  cursor: ns-resize;
  box-shadow: 0 0 0 4px rgba(168,85,247,0.2);
  transition: box-shadow 0.15s;
}
#incomeSlider::-webkit-slider-thumb:hover { box-shadow: 0 0 0 6px rgba(168,85,247,0.35); }

#incomeSlider::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border: none;
  border-radius: 50%;
  background: var(--purple);
  cursor: ns-resize;
}

.income-display {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  font-size: 1rem;
  font-weight: 700;
  color: var(--purple);
  letter-spacing: -0.02em;
  white-space: nowrap;
}

#chart {
  display: block;
  flex-shrink: 0;
  cursor: ns-resize;
  touch-action: none;
  user-select: none;
}

/* ── Info panel ── */
.info-panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 250px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
}

.card-title {
  font-size: 0.65rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.09em;
  margin-bottom: 10px;
}

.info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 3px 0;
  font-size: 0.82rem;
}

.dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 2px;
  margin-right: 7px;
  vertical-align: middle;
  flex-shrink: 0;
}

.row-label {
  display: flex;
  align-items: center;
  color: var(--muted);
  font-size: 0.78rem;
}

.row-label .rate { opacity: 0.6; margin-left: 4px; }

.row-value { font-weight: 600; font-size: 0.82rem; white-space: nowrap; }

.divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: 8px 0;
}

.highlight-row {
  background: rgba(168,85,247,0.07);
  border-radius: 6px;
  padding: 6px 8px;
  margin-top: 2px;
}

.bracket-item {
  border-bottom: 1px solid var(--border);
  padding: 7px 0;
}
.bracket-item:last-child { border-bottom: none; }

.bracket-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 2px;
}

.bracket-name {
  font-size: 0.75rem;
  display: flex;
  align-items: center;
}

.rate-badge {
  background: rgba(168,85,247,0.15);
  color: var(--purple);
  border-radius: 4px;
  font-size: 0.68rem;
  font-weight: 700;
  padding: 1px 5px;
  white-space: nowrap;
}

.bracket-amount { font-size: 0.78rem; font-weight: 600; text-align: right; }
.bracket-sub    { font-size: 0.68rem; color: var(--muted); }

.footnote {
  font-size: 0.66rem;
  color: var(--muted);
  line-height: 1.45;
  margin-top: 8px;
}
</style>
</head>
<body>

<header>
  <h1 id="pageTitle"></h1>
  <p id="subtitle"></p>
</header>

<div class="controls">
  <div class="group" id="presets">
    <span id="axisLabel"></span>
    <button data-max="100000" class="active">100k</button>
    <button data-max="200000">200k</button>
    <button data-max="300000">300k</button>
  </div>
  <label class="toggle" id="svToggle">
    <input type="checkbox" id="svCheck">
    <span id="svLabel"></span>
  </label>
  <div class="group" id="langs">
    <button data-lang="de">de</button>
    <button data-lang="en">en</button>
  </div>
</div>

<div class="main">

  <div class="slider-section">
    <div class="slider-label" id="sliderLabel"></div>
    <div class="slider-track" id="sliderTrack">
      <input type="range" id="incomeSlider" min="0" max="100000" value="60000" step="100">
    </div>
    <div class="income-display" id="incomeDisplay"></div>
  </div>

  <svg id="chart" width="480" height="620"></svg>

  <div class="info-panel" id="infoPanel"></div>

</div>

<script>
// ── Sprachen ────────────────────────────────────────────
const STRINGS = {
  de: {
    docTitle: 'Deutsches Steuersystem 2024',
    title: 'Deutsches Steuersystem',
    subtitleTax: 'Einkommensteuer 2024 · Ledig · Steuerklasse I · zu versteuerndes Einkommen',
    subtitleAll: 'Einkommensteuer + Sozialabgaben 2024 · Ledig, kinderlos, West · Bruttolohn',
    axis: 'Achse bis',
    social: 'Sozialabgaben',
    gross: 'Brutto',
    grossSalary: 'Bruttolohn',
    net: 'Netto',
    tax: 'Steuer',
    socialShort: 'SV',
    marginal: 'Grenzsatz',
    marginalAll: 'Grenzbelastung',
    capKV: 'BBG KV/PV',
    capRV: 'BBG RV/AV',
    caption: 'Breite = Belastung des nächsten Euro · Fläche = tatsächlicher Betrag',
    hint: 'Slider hoch/runter ziehen — auch direkt im Diagramm',
    summary: 'Zusammenfassung',
    grossTaxable: 'Brutto (zvE)',
    taxable: 'zu versteuern',
    effRate: 'Effektivsteuersatz',
    burdenRate: 'Abgabenquote',
    marginalRow: 'Grenzsteuersatz',
    socialCard: 'Sozialabgaben · AN-Anteil',
    pension: 'Rente',
    health: 'Kranken',
    care: 'Pflege',
    unemployment: 'Arbeitslos',
    footnote: (kv, rv) => `BBG 2024: ${kv} € (KV/PV) bzw. ${rv} € (RV/AV) — darüber steigen die `
      + 'Beiträge nicht mehr. RV, KV und PV mindern als Vorsorgeaufwendungen die Steuer.',
    byZone: 'Steuer nach Zonen',
    zvEShort: 'zvE',
    belowGFB: 'Unterhalb Grundfreibetrag',
    monthly: 'Monatlich',
    zones: ['Grundfreibetrag', 'Progressionszone I', 'Progressionszone II', 'Proportionalzone', 'Reichensteuer'],
  },
  en: {
    docTitle: 'German Tax System 2024',
    title: 'German Tax System',
    subtitleTax: 'Income tax 2024 · Single · Tax class I · taxable income',
    subtitleAll: 'Income tax + social contributions 2024 · Single, no children, West · gross salary',
    axis: 'Axis up to',
    social: 'Social contributions',
    gross: 'Gross',
    grossSalary: 'Gross salary',
    net: 'Net',
    tax: 'Tax',
    socialShort: 'Social',
    marginal: 'Marginal',
    marginalAll: 'Marginal burden',
    capKV: 'Cap health/care',
    capRV: 'Cap pension/unempl.',
    caption: 'Width = burden on the next euro · Area = actual amount',
    hint: 'Drag the slider up/down — or drag inside the chart',
    summary: 'Summary',
    grossTaxable: 'Gross (taxable)',
    taxable: 'Taxable income',
    effRate: 'Effective tax rate',
    burdenRate: 'Total burden',
    marginalRow: 'Marginal tax rate',
    socialCard: 'Social contributions · employee',
    pension: 'Pension',
    health: 'Health',
    care: 'Long-term care',
    unemployment: 'Unemployment',
    footnote: (kv, rv) => `2024 caps: €${kv} (health/care) and €${rv} (pension/unempl.) — above them `
      + 'contributions stop growing. Pension, health and care insurance are tax-deductible.',
    byZone: 'Tax by bracket',
    zvEShort: 'taxable',
    belowGFB: 'Below basic allowance',
    monthly: 'Monthly',
    zones: ['Basic allowance', 'Progressive zone I', 'Progressive zone II', 'Proportional zone', 'Top rate'],
  },
};

let lang = (localStorage.getItem('taxLang')
  || (navigator.language || 'de').slice(0, 2).toLowerCase()) === 'de' ? 'de' : 'en';
const t = k => STRINGS[lang][k];

// ── Einkommensteuertarif 2024 (§32a EStG) ───────────────
const GFB    = 11604;   // Grundfreibetrag
const Z2_END = 17005;
const Z3_END = 66760;
const Z4_END = 277825;

function incomeTax(zvE) {
  zvE = Math.floor(zvE);
  if (zvE <= GFB) return 0;
  if (zvE <= Z2_END) {
    const y = (zvE - GFB) / 10000;
    return Math.floor((922.98 * y + 1400) * y);
  }
  if (zvE <= Z3_END) {
    const z = (zvE - Z2_END) / 10000;
    return Math.floor((181.19 * z + 2397) * z + 1025.38);
  }
  if (zvE <= Z4_END) return Math.floor(0.42 * zvE - 10602.13);
  return Math.floor(0.45 * zvE - 18936.88);
}

// Grenzsteuersatz bezogen auf das zu versteuernde Einkommen
function marginalRate(zvE) {
  if (zvE <= GFB) return 0;
  if (zvE <= Z2_END) {
    const y = (zvE - GFB) / 10000;
    return (1845.96 * y + 1400) / 10000;
  }
  if (zvE <= Z3_END) {
    const z = (zvE - Z2_END) / 10000;
    return (362.38 * z + 2397) / 10000;
  }
  if (zvE <= Z4_END) return 0.42;
  return 0.45;
}

const ZONES = [
  { i: 0, rateLabel: '0 %',     min: 0,      max: GFB,      color: null      },
  { i: 1, rateLabel: '14–24 %', min: GFB,    max: Z2_END,   color: '#f0abfc' },
  { i: 2, rateLabel: '24–42 %', min: Z2_END, max: Z3_END,   color: '#c084fc' },
  { i: 3, rateLabel: '42 %',    min: Z3_END, max: Z4_END,   color: '#7c3aed' },
  { i: 4, rateLabel: '45 %',    min: Z4_END, max: Infinity, color: '#4c1d95' },
];

// ── Sozialversicherung 2024, Arbeitnehmeranteile ────────
const BBG_KV = 62100;   // Beitragsbemessungsgrenze KV/PV
const BBG_RV = 90600;   // Beitragsbemessungsgrenze RV/AV (West)

const R_RV = 0.093;     // Rentenversicherung 18,6 % / 2
const R_AV = 0.013;     // Arbeitslosenversicherung 2,6 % / 2
const R_KV = 0.0815;    // Krankenversicherung 7,3 % + halber Zusatzbeitrag 0,85 %
const R_PV = 0.023;     // Pflegeversicherung 1,7 % + 0,6 % Kinderlosenzuschlag

// Als Vorsorgeaufwendungen abzugsfähig (Vorsorgepauschale, vereinfacht):
// RV voll, KV zum ermäßigten Satz (7,0 % + 0,85 %), PV voll — die AV nicht.
const D_KV = 0.0785;

const SV_ZONES = [
  { min: 0,      max: BBG_KV, color: '#2dd4bf' },
  { min: BBG_KV, max: BBG_RV, color: '#0d9488' },
];

let withSV = false;

function socialTotal(gross) {
  const rv = R_RV * Math.min(gross, BBG_RV);
  const av = R_AV * Math.min(gross, BBG_RV);
  const kv = R_KV * Math.min(gross, BBG_KV);
  const pv = R_PV * Math.min(gross, BBG_KV);
  return { rv, av, kv, pv, total: rv + av + kv + pv };
}

// Grenzbelastung durch Sozialabgaben — sinkt an jeder BBG
function socialMarginal(gross) {
  if (!withSV) return 0;
  if (gross <= BBG_KV) return R_RV + R_AV + R_KV + R_PV;
  if (gross <= BBG_RV) return R_RV + R_AV;
  return 0;
}

// Abzugsfähige Vorsorgeaufwendungen mindern die Bemessungsgrundlage
function deductible(gross) {
  if (!withSV) return 0;
  return R_RV * Math.min(gross, BBG_RV) + (D_KV + R_PV) * Math.min(gross, BBG_KV);
}

function deductibleMarginal(gross) {
  if (!withSV) return 0;
  if (gross <= BBG_KV) return R_RV + D_KV + R_PV;
  if (gross <= BBG_RV) return R_RV;
  return 0;
}

const zvEOf = gross => Math.max(0, gross - deductible(gross));

// Grenzsteuersatz bezogen auf das Brutto (Kettenregel über die Bemessungsgrundlage)
const taxMarginal = gross => marginalRate(zvEOf(gross)) * (1 - deductibleMarginal(gross));

// Brutto, bei dem ein bestimmtes zvE erreicht wird
function grossAtZvE(target) {
  if (!withSV) return target;
  let lo = 0, hi = Math.max(target * 2, 1e6);
  for (let i = 0; i < 60; i++) {
    const mid = (lo + hi) / 2;
    if (zvEOf(mid) < target) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

function breakdown(zvE) {
  return ZONES.map(z => {
    if (zvE <= z.min) return null;
    const incomeInZone = Math.min(zvE, z.max) - z.min;
    const taxFromZone  = incomeTax(Math.min(zvE, z.max)) - incomeTax(z.min);
    return { ...z, incomeInZone, taxFromZone };
  }).filter(Boolean);
}

// ── Geometrie ───────────────────────────────────────────
const SVG_W = 480, SVG_H = 620;
const PAD_L = 52, PAD_R = 64, PAD_T = 22, PAD_B = 78;
const PLOT_X0 = PAD_L, PLOT_X1 = SVG_W - PAD_R, PLOT_W = PLOT_X1 - PLOT_X0;
const PLOT_Y0 = PAD_T, PLOT_Y1 = SVG_H - PAD_B, PLOT_H = PLOT_Y1 - PLOT_Y0;

let axisMax = 100000;
let gross   = 60000;

const yOf = v => PLOT_Y1 - (v / axisMax) * PLOT_H;
const xOf = f => PLOT_X0 + f * PLOT_W;

// Die beiden Grenzlinien: links Netto | Sozialabgaben | Steuer rechts
const xNet = v => xOf(1 - socialMarginal(v) - taxMarginal(v));
const xTax = v => xOf(1 - taxMarginal(v));
const edgeL = () => PLOT_X0;
const edgeR = () => PLOT_X1;

const svgNS = 'http://www.w3.org/2000/svg';
const chart = document.getElementById('chart');

function el(tag, attrs = {}, text = null) {
  const e = document.createElementNS(svgNS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== null) e.textContent = text;
  return e;
}
const add = (tag, attrs, text) => { const e = el(tag, attrs, text); chart.appendChild(e); return e; };

const loc    = () => lang === 'de' ? 'de-DE' : 'en-GB';
const num    = n => Math.round(n).toLocaleString(loc());
const fmt    = n => num(n) + ' €';
const fmtPct = r => {
  const s = (r * 100).toFixed(1);
  return (lang === 'de' ? s.replace('.', ',') : s) + ' %';
};
// Beitragssätze exakt, ohne überflüssige Nullen (8,15 % statt 8,2 %)
const fmtRate = r => {
  const s = (r * 100).toFixed(2).replace(/0$/, '').replace(/\.$/, '');
  return (lang === 'de' ? s.replace('.', ',') : s) + ' %';
};
const fmtK = v => {
  if (v < 1000) return String(Math.round(v));
  const s = (v / 1000).toFixed(1).replace('.0', '');
  return (lang === 'de' ? s.replace('.', ',') : s) + 'k';
};

// Stützstellen inkl. aller Sprung- und Knickstellen
function breakpoints() {
  const bp = [GFB, GFB + 0.01, Z2_END, Z3_END, Z4_END, Z4_END + 0.01].map(grossAtZvE);
  if (withSV) bp.push(BBG_KV, BBG_KV + 0.01, BBG_RV, BBG_RV + 0.01);
  return bp;
}

function samples(v0, v1) {
  const set = new Set([v0, v1]);
  const step = Math.max((v1 - v0) / 300, 1);
  for (let v = v0; v < v1; v += step) set.add(v);
  for (const b of breakpoints()) if (b > v0 && b < v1) set.add(b);
  return [...set].sort((a, b) => a - b);
}

// Fläche zwischen zwei Grenzlinien über den Einkommensbereich [v0, v1]
function bandPath(v0, v1, fLeft, fRight) {
  const vs = samples(v0, v1);
  let d = '';
  vs.forEach((v, i) => { d += (i ? 'L' : 'M') + fLeft(v).toFixed(2) + ' ' + yOf(v).toFixed(2); });
  for (let i = vs.length - 1; i >= 0; i--) {
    d += 'L' + fRight(vs[i]).toFixed(2) + ' ' + yOf(vs[i]).toFixed(2);
  }
  return d + 'Z';
}

function linePath(f, v0, v1) {
  let d = '';
  samples(v0, v1).forEach((v, i) => { d += (i ? 'L' : 'M') + f(v).toFixed(2) + ' ' + yOf(v).toFixed(2); });
  return d;
}

function drawBands(zonesInGross, v0, v1, fLeft, fRight, opacity) {
  for (const z of zonesInGross) {
    if (!z.color) continue;
    const lo = Math.max(z.lo, v0), hi = Math.min(z.hi, v1, axisMax);
    if (hi - lo < 0.5) continue;
    add('path', {
      d: bandPath(lo + 0.001, hi, fLeft, fRight),
      fill: z.color, opacity,
      stroke: z.color, 'stroke-width': 0.6, 'stroke-opacity': opacity
    });
  }
}

// Steuerzonen in Brutto-Koordinaten
const taxZonesGross = () => ZONES.map(z => ({
  ...z, lo: grossAtZvE(z.min), hi: z.max === Infinity ? Infinity : grossAtZvE(z.max)
}));
const svZonesGross = () => SV_ZONES.map(z => ({ ...z, lo: z.min, hi: z.max }));

// ── Rendering ───────────────────────────────────────────
function render() {
  chart.innerHTML = '';

  const zvE      = zvEOf(gross);
  const totalTax = incomeTax(zvE);
  const sv       = withSV ? socialTotal(gross) : { rv: 0, av: 0, kv: 0, pv: 0, total: 0 };
  const net      = gross - totalTax - sv.total;
  const zones    = breakdown(zvE);
  const mTax     = taxMarginal(gross);
  const mSV      = socialMarginal(gross);
  const lineY    = yOf(gross);
  const taxZ     = taxZonesGross();

  add('rect', { x: 0, y: 0, width: SVG_W, height: SVG_H, fill: '#161b22', rx: 12 });

  // ── noch nicht erreichter Bereich (Ausblick nach oben) ──
  if (gross < axisMax) {
    add('path', { d: bandPath(gross, axisMax, edgeL, xNet), fill: '#ebebeb', opacity: 0.035 });
    if (withSV) drawBands(svZonesGross(), gross, axisMax, xNet, xTax, 0.13);
    drawBands(taxZ, gross, axisMax, xTax, edgeR, 0.13);
  }

  // ── bezahlter Bereich ──
  if (gross > 0) {
    add('path', { d: bandPath(0, gross, edgeL, xNet), fill: '#ebebeb' });
    if (withSV) drawBands(svZonesGross(), 0, gross, xNet, xTax, 1);
    drawBands(taxZ, 0, gross, xTax, edgeR, 1);
  }

  // ── Grenzlinien ──
  if (withSV) {
    add('path', {
      d: linePath(xTax, 0, axisMax),
      fill: 'none', stroke: '#e6edf3', 'stroke-width': 1.1,
      'stroke-linejoin': 'round', opacity: 0.5
    });
  }
  add('path', {
    d: linePath(xNet, 0, axisMax),
    fill: 'none', stroke: '#e6edf3', 'stroke-width': 1.6,
    'stroke-linejoin': 'round', opacity: 0.85
  });

  // ── Y-Achse ──
  add('line', { x1: PLOT_X0, y1: PLOT_Y0, x2: PLOT_X0, y2: PLOT_Y1, stroke: '#30363d' });

  const ticks = [0, ...[GFB, Z2_END, Z3_END, Z4_END].map(grossAtZvE), axisMax]
    .filter(v => v <= axisMax)
    .sort((a, b) => a - b);
  let lastLabelY = Infinity;
  for (const tv of ticks) {
    const y = yOf(tv);
    if (tv > 0 && tv < axisMax) {
      add('line', {
        x1: PLOT_X0, y1: y, x2: PLOT_X1, y2: y,
        stroke: '#30363d', 'stroke-width': 0.8, 'stroke-dasharray': '3,3', opacity: 0.55
      });
    }
    if (lastLabelY - y < 11) continue;
    lastLabelY = y;
    add('text', {
      x: PLOT_X0 - 6, y, 'text-anchor': 'end', 'dominant-baseline': 'middle',
      fill: '#8b949e', 'font-size': 8.5
    }, tv === 0 ? '0' : fmtK(tv));
  }

  // ── Beitragsbemessungsgrenzen ──
  if (withSV) {
    for (const [v, name] of [[BBG_KV, t('capKV')], [BBG_RV, t('capRV')]]) {
      if (v > axisMax) continue;
      const y = yOf(v);
      add('line', {
        x1: PLOT_X0, y1: y, x2: PLOT_X1, y2: y,
        stroke: '#2dd4bf', 'stroke-width': 0.9, 'stroke-dasharray': '2,3', opacity: 0.75
      });
      add('text', {
        x: PLOT_X0 + 5, y: y - 4, fill: '#2dd4bf', 'font-size': 8, opacity: 0.9
      }, name + ' ' + fmtK(v));
    }
  }

  // ── Steuerzonen im rechten Rand (von oben nach unten) ──
  let lastZoneY = -Infinity;
  for (const z of [...taxZ].reverse()) {
    const lo = Math.max(z.lo, 0), hi = Math.min(z.hi, axisMax);
    if (hi - lo < 1) continue;
    const yMid = yOf((lo + hi) / 2);
    add('line', {
      x1: PLOT_X1, y1: yOf(hi), x2: PLOT_X1 + 5, y2: yOf(hi),
      stroke: '#30363d', 'stroke-width': 0.8
    });
    if (yMid - lastZoneY < 12) continue;
    lastZoneY = yMid;
    add('text', {
      x: PLOT_X1 + 8, y: yMid, 'dominant-baseline': 'middle',
      fill: z.color ?? '#6b7280', 'font-size': 9, 'font-weight': z.color ? 700 : 400,
      opacity: gross > lo ? 1 : 0.45
    }, z.rateLabel);
  }

  // ── Flächenbeschriftung ──
  const outlined = (x, y, text, size, weight, opacity) => add('text', {
    x, y, 'text-anchor': 'middle', fill: '#fff',
    stroke: 'rgba(0,0,0,0.4)', 'stroke-width': size > 11 ? 2.6 : 2.4,
    'paint-order': 'stroke', 'font-size': size, 'font-weight': weight, opacity
  }, text);

  if (gross > 0 && PLOT_Y1 - lineY > 46) {
    const vN = gross * 0.55;
    if (xNet(vN) - PLOT_X0 > 54) {
      add('text', {
        x: (PLOT_X0 + xNet(vN)) / 2, y: yOf(vN) - 5, 'text-anchor': 'middle',
        fill: '#1a1a2e', 'font-size': 13, 'font-weight': 700
      }, t('net'));
      add('text', {
        x: (PLOT_X0 + xNet(vN)) / 2, y: yOf(vN) + 10, 'text-anchor': 'middle',
        fill: '#4a4a5e', 'font-size': 9.5
      }, fmt(net));
    }

    const vT = gross * 0.5;
    if (PLOT_X1 - xTax(vT) > 66) {
      outlined((xTax(vT) + PLOT_X1) / 2, yOf(vT) - 5, t('tax'), 13, 700, 1);
      outlined((xTax(vT) + PLOT_X1) / 2, yOf(vT) + 10, fmt(totalTax), 9.5, 400, 0.92);
    }

    if (withSV) {
      const vS = Math.min(gross, BBG_KV) * 0.5;
      if (vS < gross && xTax(vS) - xNet(vS) > 74) {
        outlined((xNet(vS) + xTax(vS)) / 2, yOf(vS) - 4, t('social'), 10.5, 700, 1);
        outlined((xNet(vS) + xTax(vS)) / 2, yOf(vS) + 9, fmt(sv.total), 9, 400, 0.92);
      }
    }
  }

  // ── Effektive Aufteilung: flächengleiche Senkrechte ──
  const xEffNet = xOf(gross > 0 ? 1 - (totalTax + sv.total) / gross : 1);
  const xEffTax = xOf(gross > 0 ? 1 - totalTax / gross : 1);
  if (gross > 0) {
    for (const x of withSV ? [xEffNet, xEffTax] : [xEffNet]) {
      add('line', {
        x1: x, y1: lineY, x2: x, y2: PLOT_Y1,
        stroke: '#0d1117', 'stroke-width': 1, 'stroke-dasharray': '4,3', opacity: 0.5
      });
    }
  }

  // ── Slider ──
  add('line', {
    x1: PLOT_X0 - 8, y1: lineY, x2: PLOT_X1 + 8, y2: lineY,
    stroke: '#a855f7', 'stroke-width': 2
  });
  add('circle', { cx: PLOT_X0 - 8, cy: lineY, r: 4, fill: '#a855f7' });
  add('circle', { cx: PLOT_X1 + 8, cy: lineY, r: 4, fill: '#a855f7' });

  const xCut = xNet(gross);
  add('circle', { cx: xCut, cy: lineY, r: 4.5, fill: '#0d1117', stroke: '#a855f7', 'stroke-width': 2 });
  const labelLeft = xCut > PLOT_X0 + PLOT_W * 0.6;
  add('text', {
    x: xCut + (labelLeft ? -10 : 10), y: lineY - 9,
    'text-anchor': labelLeft ? 'end' : 'start',
    fill: '#a855f7', 'font-size': 10, 'font-weight': 700,
    stroke: '#161b22', 'stroke-width': 2.6, 'paint-order': 'stroke'
  }, (withSV ? t('marginalAll') : t('marginal')) + ' ' + fmtPct(mTax + mSV));

  // ── X-Achse mit effektiver Aufteilung ──
  add('line', { x1: PLOT_X0, y1: PLOT_Y1, x2: PLOT_X1, y2: PLOT_Y1, stroke: '#30363d' });

  const by = PLOT_Y1 + 16;
  const bracket = (x0, x1, color, label, allowOutside) => {
    if (x1 - x0 < 1) return;
    add('line', { x1: x0, y1: by, x2: x1, y2: by, stroke: color, 'stroke-width': 2 });
    add('line', { x1: x0, y1: by - 3, x2: x0, y2: by + 3, stroke: color, 'stroke-width': 2 });
    add('line', { x1: x1, y1: by - 3, x2: x1, y2: by + 3, stroke: color, 'stroke-width': 2 });
    const wide = x1 - x0 > 46;
    if (!wide && !allowOutside) return;
    add('text', {
      x: wide ? (x0 + x1) / 2 : SVG_W - 6,
      y: by + 15,
      'text-anchor': wide ? 'middle' : 'end',
      fill: color, 'font-size': 9.5, 'font-weight': 600
    }, label);
  };
  const share = v => gross > 0 ? fmtPct(v / gross) : '–';
  bracket(PLOT_X0, xEffNet, '#ebebeb', t('net') + ' ' + share(net), false);
  if (withSV) bracket(xEffNet, xEffTax, '#2dd4bf', t('socialShort') + ' ' + share(sv.total), false);
  bracket(xEffTax, PLOT_X1, '#a855f7', t('tax') + ' ' + share(totalTax), true);

  add('text', {
    x: SVG_W / 2, y: PLOT_Y1 + 50, 'text-anchor': 'middle',
    fill: '#8b949e', 'font-size': 9
  }, t('caption'));
  add('text', {
    x: SVG_W / 2, y: PLOT_Y1 + 63, 'text-anchor': 'middle',
    fill: '#6b7280', 'font-size': 8.5
  }, t('hint'));

  updatePanel({ gross, zvE, totalTax, sv, net, zones, mTax, mSV });
}

// ── Info panel ──────────────────────────────────────────
function updatePanel({ gross, zvE, totalTax, sv, net, zones, mTax, mSV }) {
  const panel = document.getElementById('infoPanel');
  const taxZones = zones.filter(z => z.color && z.taxFromZone > 0);
  const pct = v => gross > 0 ? fmtPct(v / gross) : '–';
  const svRow = (key, rate, value) => `
      <div class="info-row">
        <span class="row-label">${t(key)}<span class="rate">${rate}</span></span>
        <span class="row-value">${fmt(value)}</span>
      </div>`;

  panel.innerHTML = `
    <div class="card">
      <div class="card-title">${t('summary')}</div>
      <div class="info-row">
        <span class="row-label"><span class="dot" style="background:#ebebeb;border:1px solid #ccc"></span>${t('net')}</span>
        <span class="row-value">${fmt(net)}</span>
      </div>
      ${withSV ? `
      <div class="info-row">
        <span class="row-label"><span class="dot" style="background:#2dd4bf"></span>${t('social')}</span>
        <span class="row-value">${fmt(sv.total)}</span>
      </div>` : ''}
      <div class="info-row">
        <span class="row-label"><span class="dot" style="background:#a855f7"></span>${t('tax')}</span>
        <span class="row-value">${fmt(totalTax)}</span>
      </div>
      <hr class="divider">
      <div class="info-row">
        <span class="row-label">${withSV ? t('grossSalary') : t('grossTaxable')}</span>
        <span class="row-value">${fmt(gross)}</span>
      </div>
      ${withSV ? `
      <div class="info-row">
        <span class="row-label">${t('taxable')}</span>
        <span class="row-value">${fmt(zvE)}</span>
      </div>` : ''}
      <div class="info-row">
        <span class="row-label">${withSV ? t('burdenRate') : t('effRate')}</span>
        <span class="row-value">${pct(totalTax + sv.total)}</span>
      </div>
      <div class="info-row highlight-row">
        <span class="row-label">${withSV ? t('marginalAll') : t('marginalRow')}</span>
        <span class="row-value" style="color:#a855f7">${fmtPct(mTax + mSV)}</span>
      </div>
    </div>

    ${withSV ? `
    <div class="card">
      <div class="card-title">${t('socialCard')}</div>
      ${svRow('pension', fmtRate(R_RV), sv.rv)}
      ${svRow('health', fmtRate(R_KV), sv.kv)}
      ${svRow('care', fmtRate(R_PV), sv.pv)}
      ${svRow('unemployment', fmtRate(R_AV), sv.av)}
      <div class="footnote">${t('footnote')(num(BBG_KV), num(BBG_RV))}</div>
    </div>` : ''}

    <div class="card">
      <div class="card-title">${t('byZone')}</div>
      ${taxZones.map(z => `
        <div class="bracket-item">
          <div class="bracket-header">
            <span class="bracket-name">
              <span class="dot" style="background:${z.color}"></span>
              <span>${STRINGS[lang].zones[z.i]}</span>
            </span>
            <span class="rate-badge">${z.rateLabel}</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:baseline;padding-left:16px">
            <span class="bracket-sub">${fmt(z.incomeInZone)} ${t('zvEShort')}</span>
            <span class="bracket-amount">${fmt(z.taxFromZone)}</span>
          </div>
        </div>
      `).join('')}
      ${taxZones.length === 0 ? `<div style="color:#8b949e;font-size:0.8rem">${t('belowGFB')}</div>` : ''}
    </div>

    <div class="card">
      <div class="card-title">${t('monthly')}</div>
      <div class="info-row">
        <span class="row-label">${t('gross')}</span>
        <span class="row-value">${fmt(gross / 12)}</span>
      </div>
      <div class="info-row">
        <span class="row-label"><span class="dot" style="background:#ebebeb;border:1px solid #ccc"></span>${t('net')}</span>
        <span class="row-value">${fmt(net / 12)}</span>
      </div>
      ${withSV ? `
      <div class="info-row">
        <span class="row-label"><span class="dot" style="background:#2dd4bf"></span>${t('social')}</span>
        <span class="row-value">${fmt(sv.total / 12)}</span>
      </div>` : ''}
      <div class="info-row">
        <span class="row-label"><span class="dot" style="background:#a855f7"></span>${t('tax')}</span>
        <span class="row-value">${fmt(totalTax / 12)}</span>
      </div>
    </div>
  `;
}

// ── Interaktion ─────────────────────────────────────────
const slider  = document.getElementById('incomeSlider');
const display = document.getElementById('incomeDisplay');
const track   = document.getElementById('sliderTrack');

// Slider-Bahn exakt auf die Plot-Fläche legen.
// Der Thumb-Mittelpunkt läuft nur über (Breite − Thumbbreite), daher +THUMB.
const THUMB = 20;
document.querySelector('.slider-section').style.height = SVG_H + 'px';
track.style.top    = PLOT_Y0 + 'px';
track.style.height = PLOT_H + 'px';
slider.style.width = (PLOT_H + THUMB) + 'px';
display.style.top  = (PLOT_Y1 + 14) + 'px';

function setGross(v) {
  gross = Math.min(Math.max(Math.round(v), 0), axisMax);
  slider.value = gross;
  display.textContent = fmt(gross);
  render();
}

slider.addEventListener('input', () => setGross(parseInt(slider.value, 10)));

// Direkt im Diagramm ziehen
let dragging = false;
function grossFromEvent(ev) {
  const r = chart.getBoundingClientRect();
  const y = (ev.clientY - r.top) * (SVG_H / r.height);
  const v = (PLOT_Y1 - y) / PLOT_H * axisMax;
  return Math.round(Math.min(Math.max(v, 0), axisMax) / 100) * 100;
}
chart.addEventListener('pointerdown', e => {
  dragging = true;
  chart.setPointerCapture(e.pointerId);
  setGross(grossFromEvent(e));
});
chart.addEventListener('pointermove', e => { if (dragging) setGross(grossFromEvent(e)); });
chart.addEventListener('pointerup',     () => { dragging = false; });
chart.addEventListener('pointercancel', () => { dragging = false; });

// Achsenbereich
document.getElementById('presets').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  axisMax = parseInt(btn.dataset.max, 10);
  slider.max = axisMax;
  document.querySelectorAll('#presets button')
    .forEach(b => b.classList.toggle('active', b === btn));
  setGross(gross);
});

// Sozialabgaben
const svCheck  = document.getElementById('svCheck');
const svToggle = document.getElementById('svToggle');
svCheck.addEventListener('change', () => { withSV = svCheck.checked; applyLang(); });

// Sprache
document.getElementById('langs').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  lang = btn.dataset.lang;
  localStorage.setItem('taxLang', lang);
  applyLang();
});

function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('docTitle');
  document.getElementById('pageTitle').textContent = t('title');
  document.getElementById('subtitle').textContent  = withSV ? t('subtitleAll') : t('subtitleTax');
  document.getElementById('axisLabel').textContent = t('axis');
  document.getElementById('svLabel').textContent   = t('social');
  document.getElementById('sliderLabel').textContent = withSV ? t('grossSalary') : t('gross');
  svToggle.classList.toggle('on', withSV);
  document.querySelectorAll('#langs button')
    .forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  setGross(gross);
}

applyLang();
</script>
</body>
</html>
